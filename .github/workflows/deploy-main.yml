# Deploy to Production Environment
# Triggered on merge to main branch

name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  APP_NAME: edas-hub
  WORKSPACE_PATH: /Workspace/Shared/apps/edas-hub

jobs:
  build-and-deploy:
    runs-on:
      group: databricks-field-eng-protected-runner-group
      labels: ubuntu-latest
    environment: production  # Requires approval if configured in GitHub
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Use relative URL for production (same host serves frontend + API)
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Copy frontend to backend
        run: |
          rm -rf backend/static
          mkdir -p backend/static
          cp -r dist/* backend/static/

      # Environment configuration is now defined in databricks.yml
      # including Lakebase database settings, agent config, branding, etc.

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.295.0/install.sh | sh

      - name: Configure Databricks CLI (OAuth)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          # Verify OAuth credentials are set
          if [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "Error: DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET must be set"
            exit 1
          fi
          # CLI will use environment variables automatically for OAuth M2M
          databricks auth describe

      - name: Deploy Bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle deploy -t prod --var "app_name=${{ env.APP_NAME }}"

      - name: Deploy App Container
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks apps deploy ${{ env.APP_NAME }}

      - name: Get App URL
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          APP_URL=$(databricks apps get ${{ env.APP_NAME }} --output json | jq -r '.url')
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**App URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
