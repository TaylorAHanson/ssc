# Continuous Integration
# Runs on all PRs and pushes to feature/*, hotfix/*, bugfix/* branches

name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'bugfix/**'

jobs:
  lint-and-test-frontend:
    runs-on: ubuntu-latest
    name: Frontend Lint & Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "Linting completed with warnings"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  lint-and-test-backend:
    runs-on: ubuntu-latest
    name: Backend Lint & Test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check . --ignore=E501,F401 || echo "Linting completed with warnings"

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

  security-check:
    runs-on: ubuntu-latest
    name: Security Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Simple check for common secret patterns
          if grep -rE "(password|secret|token|api_key)\s*=\s*['\"][^'\"]+['\"]" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" . 2>/dev/null | grep -v "\.env\.example" | grep -v "node_modules" | grep -v ".git"; then
            echo "⚠️ Warning: Potential hardcoded secrets found. Please review."
          else
            echo "✅ No obvious hardcoded secrets found."
          fi
