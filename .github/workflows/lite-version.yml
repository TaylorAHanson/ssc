name: Publish Lite Version

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  publish-lite:
    runs-on:
      group: databricks-field-eng-protected-runner-group
      labels: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0 # Need full history to push to another branch? Actually 1 is fine if we force push a new branch state

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Lite Branch
        run: |
          # Create a new branch state from current HEAD
          # We don't care about the history of the lite branch, we want it to mirror develop state
          git checkout -b lite/develop

      - name: Apply Lite Configuration
        run: |
          mv configuration.lite.yaml configuration.yaml

      - name: Commit and Push
        run: |
          git add configuration.yaml
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No lite configuration changes found. Pushing current state."
          else
             git commit -m "chore: generate lite version [skip ci]"
          fi

          # Force push to the target branch
          git push -f origin lite/develop
