# Deploy to Development Environment
# Triggered on merge to develop branch

name: Deploy to Development

on:
  push:
    branches:
      - develop

env:
  APP_NAME: edh-ssc
  TARGET: dev
  WORKSPACE_PATH: /Workspace/Shared/apps/edh-ssc-dev

jobs:
  build-and-deploy:
    runs-on:
      group: databricks-field-eng-protected-runner-group
      labels: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.1

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.295.0/install.sh | sh

      - name: Configure Databricks CLI (OAuth)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          # Verify OAuth credentials are set
          if [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "Error: DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET must be set"
            exit 1
          fi
          # CLI will use environment variables automatically for OAuth M2M
          databricks auth describe

      - name: Deploy Bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle deploy -t ${{ env.TARGET }}

      - name: Run App
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle run ${{ env.APP_NAME }} -t ${{ env.TARGET }}