bundle:
  name: edh-ssc
  # Require minimum CLI version for Databricks Apps with app.config support
  databricks_cli_version: ">=0.283.0"

# Resources
resources:
  
  postgres_projects:
    edh_ssc:
      project_id: "edh-ssc-${var.environment}"
      display_name: "edh-ssc ${var.environment}"
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2

    postgres_branches:
      production:
        parent: ${resources.postgres_projects.edh_ssc.id}
        branch_id: production
        no_expiry: true

    postgres_endpoints:
      primary:
        parent: ${resources.postgres_branches.production.id}
        endpoint_id: primary
        endpoint_type: ENDPOINT_TYPE_READ_WRITE
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2

  # Apps
  apps:
    edh-ssc:
      name: ${var.app_name}
      description: "edh-ssc - Self-service platform for ${var.environment}"
      source_code_path: "${var.source_code_path}"
      compute_size: MEDIUM
      resources:
        - name: lakebase-db
          postgres:
            branch: ${resources.postgres_branches.production.id}
            database: ${resources.postgres_branches.production.id}/databases/databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
      config:
        command:
          - python
          - backend/run.py
        env:
          - name: ENVIRONMENT
            value: "${var.environment}"
          - name: DATABASE_HOST
            value: "${var.lakebase_host}"
          - name: DATABASE_INSTANCE_NAME
            value: "${resources.postgres_projects.edh-ssc-project.project_id}"
          - name: GITOPS_MODE
            value: "${var.gitops_mode}"
          - name: GITOPS_VOLUME_PATH
            value: "${var.gitops_volume_path}"
          - name: DEFAULT_ENVIRONMENT
            value: "${var.environment}"
          - name: GIT_USERNAME
            value: "${var.git_username}"
          - name: GIT_EMAIL
            value: "${var.git_email}"
          - name: INFRA_REPO_URL
            value: "${var.infra_repo_url}"
          - name: INFRA_REPO_BRANCH
            value: "${var.infra_repo_branch}"
          - name: GIT_TOKEN_SECRET_SCOPE
            value: "${var.github_pat_secret_scope}"
          - name: GIT_TOKEN_SECRET_KEY
            value: "${var.github_pat_secret_key}"
          - name: GITHUB_APP_PRIVATE_KEY_SECRET_SCOPE
            value: "edh-ssc-hub"
          - name: GITHUB_APP_PRIVATE_KEY_SECRET_KEY
            value: "github-app-private-key"
          - name: DATABRICKS_WAREHOUSE_ID
            value: "${var.sql_warehouse_id}"
          - name: MODEL_SERVING_AGENT_LLM_ENDPOINT
            value: "${var.model_serving_endpoint}"
          - name: AGENT_ENABLED
            value: "true"
          - name: AGENT_MAX_ITERATIONS
            value: "10"
          - name: AGENT_TIMEOUT_SECONDS
            value: "60"
          - name: CORS_ORIGINS
            value: "*"
          - name: POLLER_INTERVAL_SECONDS
            value: "5"
          - name: POLLER_BATCH_SIZE
            value: "50"
          - name: POLLER_MAX_CONCURRENT
            value: "10"
          - name: POLLER_LOCK_TIMEOUT_MINUTES
            value: "5"
          - name: POLLER_LOCK_TIMEOUT_LONG_RUNNING_MINUTES
            value: "30"
          - name: POLLER_HEARTBEAT_INTERVAL_SECONDS
            value: "300"
          - name: API_V1_PREFIX
            value: "/api/v1"
          - name: PROJECT_NAME
            value: "edh-ssc"
          - name: LOG_LEVEL
            value: "INFO"
          - name: EVENT_SYNC_INTERVAL_MINUTES
            value: "60"

      user_api_scopes:
        - "sql"
        - "sql.statement-execution"
        - "sql.warehouses"
        - "files.files"

      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"

# Sync configuration
sync:
  include:
    - package.json
    - vite.config.ts
    - tsconfig.json
    - tailwind.config.js
    - postcss.config.js
    - eslint.config.js
    - index.html
    - src/**
    - public/**
    # Include all backend code
    - backend/**
    - configuration.yaml
  exclude:
    # Python cache and compiled files
    - backend/__pycache__/**
    - backend/**/__pycache__/**
    - backend/**/*.pyc
    - backend/**/*.pyo
    # Virtual environment
    - backend/venv/**
    - backend/.venv/**
    # Environment and config files
    - backend/.env
    - backend/.env.*
    # Database files
    - backend/*.db
    # IDE and OS files
    - backend/.DS_Store
    - backend/**/.DS_Store
    # Test and cache directories
    - backend/.pytest_cache/**
    - backend/.mypy_cache/**
    # Build artifacts
    - backend/*.egg-info/**
    - backend/dist/**
    - backend/build/**
    # Logs
    - backend/*.log
    # Git files
    - backend/.git/**
    - backend/.gitignore

# Variables
variables:
  dev_user:
    description: "Developer username for personal dev instances"
    default: "taylor"
  app_name:
    description: "Application name"
    default: "edh-ssc"
  environment:
    description: "Environment name (local, dev, stage, prod)"
    default: "local"
  source_code_path:
    description: "Path to source code in workspace"
    default: "."
  lakebase_host:
    description: "Lakebase Database Host"
    default: "instance-c77ef127-eeca-44f5-80ba-76b800757462.database.cloud.databricks.com"
  gitops_mode:
    description: "GitOps mode (volume or direct)"
    default: "volume"
  gitops_volume_path:
    description: "Unity Catalog Volume path for GitOps requests"
    default: "/Volumes/edh-ssc_dev_catalog/edh-ssc/gitops_requests"
  git_username:
    description: "Username for GitOps commits"
    default: "edh-ssc Bot"
  git_email:
    description: "Email for GitOps commits"
    default: "edh-ssc-bot@databricks.com"
  infra_repo_url:
    description: "URL for the infrastructure repository"
    default: "https://github.com/databricks-field-eng/fe-agentic-self-service-terraform"
  infra_repo_branch:
    description: "Branch for the infrastructure repository"
    default: "main"
  github_pat_secret_scope:
    description: "Secret scope for GitHub PAT"
    default: "edh-ssc-hub"
  github_pat_secret_key:
    description: "Secret key for GitHub PAT"
    default: "github-pat"
  sql_warehouse_id:
    description: "Databricks SQL Warehouse ID"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  model_serving_endpoint:
    description: "Model Serving Endpoint for Agent LLM"
    default: "databricks-claude-sonnet-4-6"

# Target environments
targets:
  # Local development (default)
  local:
    mode: development
    default: true
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "local"
        Environment: "local"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-local-${var.dev_user}"
      environment: "local"
      source_code_path: "."

  # Development environment
  dev:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "dev"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-dev"
      environment: "dev"
      source_code_path: "."

  # Staging environment
  stage:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "stage"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-stage"
      environment: "stage"
      source_code_path: "."

  # Production environment
  prod:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "prod"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-prod"
      environment: "prod"
      source_code_path: "."
