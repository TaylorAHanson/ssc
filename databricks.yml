bundle:
  name: edh-ssc
  # Require minimum CLI version for Databricks Apps with app.config support
  databricks_cli_version: ">=0.283.0"

# Resources
resources:
  
  database_instances:
    edh_ssc_db:
      name: "edh-ssc-${var.environment}-v5"
      enable_pg_native_login: true
      capacity: "CU_1"
      lifecycle:
        prevent_destroy: true
      permissions:
        # Authoritative ACL: must re-grant the deploying user CAN_MANAGE,
        # otherwise applying this block strips the creator's manage rights and
        # the app's `postgres` resource attach later fails with
        # "User needs MANAGE permission on the resource".
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        # The app's auto-created service principal needs access to the instance.
        # The database_instance ACL only supports CAN_MANAGE / CAN_USE — the
        # Postgres-level CONNECT+CREATE role grant is a separate plane handled by
        # the app's `postgres:` resource (permission: CAN_CONNECT_AND_CREATE
        # below). Listing the SP here as CAN_USE keeps its instance access from
        # being stripped on the next apply (this ACL is authoritative). No
        # dependency cycle: the inline permissions compile to a separate
        # databricks_permissions resource applied after the instance and app exist.
        - level: CAN_USE
          service_principal_name: ${resources.apps.edh-ssc.service_principal_client_id}
        - level: CAN_USE
          group_name: "users"

  # Apps
  apps:
    edh-ssc:
      name: ${var.app_name}
      description: "edh-ssc - Self-service platform for ${var.environment}"
      source_code_path: "${var.source_code_path}"
      resources:
        # Attach the Lakebase database as an AUTOSCALING resource (`postgres:`),
        # not the Provisioned `database:` type. Since Mar 12 2026 every instance
        # created via `database_instances` is an Autoscaling *project*; attaching
        # it with the Provisioned `database:` block makes the platform validate
        # MANAGE against a provisioned-instance securable that doesn't match the
        # project ACL you actually hold -> "User needs MANAGE permission on the
        # resource", even when you have Can Manage on the project.
        #
        # Autoscaling path facts (from `databricks postgres list-branches/-databases`):
        #   - project name  == the database instance name (edh-ssc-<env>-v5)
        #   - default branch == "production" (auto-created, not the instance name)
        #   - database id    == "databricks-postgres" (hyphen; the logical PG db
        #                        is "databricks_postgres" with an underscore)
        - name: postgres
          postgres:
            branch: projects/${resources.database_instances.edh_ssc_db.name}/branches/production
            database: projects/${resources.database_instances.edh_ssc_db.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      config:
        command:
          - python
          - backend/run.py
        env:
          - name: ENVIRONMENT
            value: "${var.environment}"
          - name: GITOPS_MODE
            value: "${var.gitops_mode}"
          - name: GITOPS_VOLUME_PATH
            value: "${var.gitops_volume_path}"
          - name: DEFAULT_ENVIRONMENT
            value: "${var.environment}"
          - name: GIT_USERNAME
            value: "${var.git_username}"
          - name: GIT_EMAIL
            value: "${var.git_email}"
          - name: INFRA_REPO_URL
            value: "${var.infra_repo_url}"
          - name: INFRA_REPO_BRANCH
            value: "${var.infra_repo_branch}"
          - name: GIT_TOKEN_SECRET_SCOPE
            value: "${var.github_pat_secret_scope}"
          - name: GIT_TOKEN_SECRET_KEY
            value: "${var.github_pat_secret_key}"
          - name: GITHUB_APP_PRIVATE_KEY_SECRET_SCOPE
            value: "edh-ssc-hub"
          - name: GITHUB_APP_PRIVATE_KEY_SECRET_KEY
            value: "github-app-private-key"
          - name: DATABRICKS_WAREHOUSE_ID
            value: "${var.sql_warehouse_id}"
          - name: MODEL_SERVING_AGENT_LLM_ENDPOINT
            value: "${var.model_serving_endpoint}"
          # AI Gateway (best practice): when set, agent LLM calls route through
          # this gateway endpoint (model routing/A-B, rate+cost limits, input
          # guardrails configured in the gateway, not in app code).
          # OMITTED WHEN BLANK: Databricks Apps rejects an env entry whose value
          # renders empty ("Must specify ... value or valueFrom"). The app's code
          # default is "" (call model_serving_endpoint directly), so leaving this
          # out is equivalent. To enable, set var.ai_gateway_endpoint and uncomment:
          # - name: AI_GATEWAY_ENDPOINT
          #   value: "${var.ai_gateway_endpoint}"
          # MLflow tracing/observability (best practice).
          - name: MLFLOW_TRACING_ENABLED
            value: "${var.mlflow_tracing_enabled}"
          # MLflow experiment path (blank = default). Omitted when blank for the
          # same reason as AI_GATEWAY_ENDPOINT above; set var.mlflow_experiment
          # and uncomment to pin a specific experiment.
          # - name: MLFLOW_EXPERIMENT
          #   value: "${var.mlflow_experiment}"
          # Governance: enforce the agent-tool OPA policy (deny + approval gates
          # actually halt mutating tools) in deployed environments. Code default
          # is shadow so local/test runs without a policy server don't fail closed.
          - name: AGENT_TOOL_OPA_ENFORCE
            value: "${var.agent_tool_opa_enforce}"
          # Governance: lock no-code workflow authoring in this environment. When
          # true, workflows can only change via an all-or-nothing bundle import
          # (promotion); no in-place create/edit/publish/delete. Prod sets true.
          - name: WORKFLOW_AUTHORING_LOCKED
            value: "${var.workflow_authoring_locked}"
          # Pluggable identity-group provider (noop|rest|lmws).
          - name: IDENTITY_PROVIDER
            value: "${var.identity_provider}"
          - name: AGENT_ENABLED
            value: "true"
          - name: AGENT_MAX_ITERATIONS
            value: "10"
          - name: AGENT_TIMEOUT_SECONDS
            value: "60"
          - name: CORS_ORIGINS
            value: "*"
          - name: POLLER_INTERVAL_SECONDS
            value: "5"
          - name: POLLER_BATCH_SIZE
            value: "50"
          - name: POLLER_MAX_CONCURRENT
            value: "10"
          - name: POLLER_LOCK_TIMEOUT_MINUTES
            value: "5"
          - name: POLLER_LOCK_TIMEOUT_LONG_RUNNING_MINUTES
            value: "30"
          - name: POLLER_HEARTBEAT_INTERVAL_SECONDS
            value: "300"
          - name: API_V1_PREFIX
            value: "/api/v1"
          - name: PROJECT_NAME
            value: "edh-ssc"
          - name: LOG_LEVEL
            value: "INFO"
          - name: EVENT_SYNC_CRON
            value: "${var.event_sync_cron}"
          - name: DATA_ASSET_SYNC_CRON
            value: "${var.data_asset_sync_cron}"
          - name: ENFORCEMENT_SENTINEL_CRON
            value: "${var.enforcement_sentinel_cron}"
          - name: DATA_QUALITY_TABLE
            value: "${var.data_quality_table}"
          - name: DATA_QUALITY_ADOC_SCHEMA
            value: "${var.data_quality_adoc_schema}"
          # Email notifications via AWS SES (sent in-app via boto3).
          # IAM credentials are read at runtime from the Databricks secret
          # scope below — never injected as plaintext env values.
          - name: NOTIFICATION_EMAIL_PROVIDER
            value: "${var.notification_email_provider}"
          - name: NOTIFICATION_EMAIL_SES_REGION
            value: "${var.ses_region}"
          - name: NOTIFICATION_EMAIL_SES_SOURCE
            value: "${var.ses_source_email}"
          - name: NOTIFICATION_EMAIL_SES_SECRET_SCOPE
            value: "${var.ses_secret_scope}"
          - name: NOTIFICATION_EMAIL_SES_ACCESS_KEY_ID_SECRET_KEY
            value: "${var.ses_access_key_id_secret_key}"
          - name: NOTIFICATION_EMAIL_SES_SECRET_ACCESS_KEY_SECRET_KEY
            value: "${var.ses_secret_access_key_secret_key}"
          # LMWS / FWS-API group management. The vendored notebook reads the
          # service-account creds (username/password) from this secret scope
          # cluster-side; the app only needs to know the scope name.
          - name: LMWS_SECRET_SCOPE
            value: "${var.lmws_secret_scope}"

      user_api_scopes:
        - "sql"
        - "sql.statement-execution"
        - "sql.warehouses"
        - "catalog.connections"
        - "dashboards.genie"
        - "files.files"
        # Workspace API (import/export/mkdirs). Required for OBO PERSONAL skills,
        # which live under /Workspace/Users/<user>/.skills. Without this the
        # user's forwarded token is downscoped and saving a personal skill fails
        # with "OAuth token does not have required scopes: workspace".
        # (files.files only covers UC Volumes via the Files API — shared skills.)
        - "workspace.workspace"
        - "genie"
        - "mcp.functions"
        - "ai-gateway"

      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"

    # ── Example standalone MCP server ──────────────────────────────────────
    # A minimal Streamable-HTTP MCP server hosted as its own Databricks App.
    # The "mcp-" name prefix is the documented signal that makes Databricks
    # surface it under Workspace → AI Gateway → MCPs. Source lives in ./mcp_app
    # (added to the sync include below). It serves the protocol at <app-url>/mcp.
    mcp-server:
      name: "mcp-${var.app_name}"
      description: "Example MCP server (Streamable HTTP) — discoverable in AI Gateway → MCPs"
      source_code_path: "./mcp_app"
      config:
        command:
          - python
          - server.py
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"

  # Scheduled LLM-as-judge quality job (best practice). Scores recent agent
  # traces (from the MLflow experiment) for helpfulness/groundedness and writes
  # the verdict back as an LLM_JUDGE assessment keyed by trace_id, to compare
  # against the human feedback captured via POST /api/v1/agent/feedback.
  jobs:
    agent_quality_judge:
      name: "${var.app_name}-agent-quality-judge-${var.environment}"
      schedule:
        quartz_cron_expression: "${var.llm_judge_cron}"
        timezone_id: "UTC"
        pause_status: "${var.llm_judge_pause_status}"
      tasks:
        - task_key: judge
          environment_key: default
          spark_python_task:
            python_file: "backend/app/jobs/llm_judge.py"
            parameters: ["--limit", "100"]
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - mlflow-skinny>=2.20.0
              - httpx
              - pydantic
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"

# Sync configuration
sync:
  include:
    - package.json
    - vite.config.ts
    - tsconfig.json
    - tailwind.config.js
    - postcss.config.js
    - eslint.config.js
    - index.html
    - src/**
    - public/**
    # Include all backend code
    - backend/**
    - configuration.yaml
    # Standalone example MCP server (deployed as its own mcp-* Databricks App)
    - mcp_app/**
  exclude:
    # Frontend dependencies and build output (never needed in the app source —
    # node_modules is ~340MB and stalls the app's "Downloading source code" phase)
    - node_modules/**
    - "**/node_modules/**"
    - dist/**
    - .vite/**
    # Python cache and compiled files
    - backend/__pycache__/**
    - backend/**/__pycache__/**
    - backend/**/*.pyc
    - backend/**/*.pyo
    # Virtual environment
    - backend/venv/**
    - backend/.venv/**
    # Environment and config files
    - backend/.env
    - backend/.env.*
    # Database files
    - backend/*.db
    # IDE and OS files
    - backend/.DS_Store
    - backend/**/.DS_Store
    # Test and cache directories
    - backend/.pytest_cache/**
    - backend/.mypy_cache/**
    # Build artifacts
    - backend/*.egg-info/**
    - backend/dist/**
    - backend/build/**
    # Logs
    - backend/*.log
    # Git files
    - backend/.git/**
    - backend/.gitignore

# Variables
variables:
  dev_user:
    description: "Developer username for personal dev instances"
    default: "taylor"
  app_name:
    description: "Application name"
    default: "edh-ssc"
  environment:
    description: "Environment name (local, dev, stage, prod)"
    default: "local"
  source_code_path:
    description: "Path to source code in workspace"
    default: "."
  lakebase_host:
    description: "Lakebase Database Host"
    default: "instance-c77ef127-eeca-44f5-80ba-76b800757462.database.cloud.databricks.com"
  gitops_mode:
    description: "GitOps mode (volume or direct)"
    default: "volume"
  gitops_volume_path:
    description: "Unity Catalog Volume path for GitOps requests"
    default: "/Volumes/edh-ssc_dev_catalog/edh-ssc/gitops_requests"
  git_username:
    description: "Username for GitOps commits"
    default: "edh-ssc Bot"
  git_email:
    description: "Email for GitOps commits"
    default: "edh-ssc-bot@databricks.com"
  infra_repo_url:
    description: "URL for the infrastructure repository"
    default: "https://github.com/databricks-field-eng/fe-agentic-self-service-terraform"
  infra_repo_branch:
    description: "Branch for the infrastructure repository"
    default: "main"
  github_pat_secret_scope:
    description: "Secret scope for GitHub PAT"
    default: "edh-ssc-hub"
  github_pat_secret_key:
    description: "Secret key for GitHub PAT"
    default: "github-pat"
  sql_warehouse_id:
    description: "Databricks SQL Warehouse ID"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  model_serving_endpoint:
    description: "Model Serving Endpoint for Agent LLM"
    default: "databricks-claude-sonnet-4-6"
  ai_gateway_endpoint:
    description: "AI Gateway serving endpoint for agent LLM (blank = call model_serving_endpoint directly). Configure A-B routing, rate/cost limits, and input guardrails on this endpoint."
    default: ""
  mlflow_tracing_enabled:
    description: "Enable MLflow tracing for the agent (true/false)"
    default: "false"
  mlflow_experiment:
    description: "MLflow experiment path for agent traces (blank = default), e.g. /Shared/selfservice-agent"
    default: ""
  agent_tool_opa_enforce:
    description: "Enforce the agent-tool OPA policy (true) vs. shadow/log-only (false). Deployed envs should enforce; requires a reachable OPA (embedded by default)."
    default: "true"
  workflow_authoring_locked:
    description: "Lock no-code workflow authoring (true) so workflows only change via all-or-nothing bundle import. Lower envs author freely (false); prod is locked (true)."
    default: "false"
  identity_provider:
    description: "Identity-group provider backend: noop | rest | lmws"
    default: "noop"
  llm_judge_cron:
    description: "Quartz cron for the scheduled LLM-as-judge quality job"
    default: "0 0 6 * * ?"
  llm_judge_pause_status:
    description: "PAUSED or UNPAUSED for the LLM-as-judge job schedule"
    default: "PAUSED"
  data_quality_table:
    description: "Table where data quality results are stored"
    default: "edh-ssc_local_catalog.edh-ssc.data_quality_results"
  data_quality_adoc_schema:
    description: "catalog.schema holding the ADOC *_history tables (adoc_dq_history, adoc_freshness_history, etc.)"
    default: "enterprise_stg.data_quality"
  event_sync_cron:
    description: "Cron schedule for syncing calendar events"
    default: "0 * * * *"
  data_asset_sync_cron:
    description: "Cron schedule for syncing data assets"
    default: "0 * * * *"
  enforcement_sentinel_cron:
    description: "Cron schedule for running enforcement sentinel"
    default: "*/30 * * * *"
  notification_email_provider:
    description: "Email provider for notifications (smtp, ses, mock)"
    default: "ses"
  ses_region:
    description: "AWS region for SES"
    default: "us-west-2"
  ses_source_email:
    description: "SES-verified source email address for notifications"
    default: "notifications@example.com"
  ses_secret_scope:
    description: "Databricks secret scope holding the SES IAM credentials"
    default: "edh-ssc-hub"
  ses_access_key_id_secret_key:
    description: "Secret key (within the scope) for the AWS access key id"
    default: "ses-aws-access-key-id"
  ses_secret_access_key_secret_key:
    description: "Secret key (within the scope) for the AWS secret access key"
    default: "ses-aws-secret-access-key"
  lmws_secret_scope:
    description: "Databricks secret scope holding the LMWS service-account creds (keys: username, password)"
    default: "lmws"

# Target environments
targets:
  # Local development (default)
  local:
    mode: development
    default: true
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "local"
        Environment: "local"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-local-${var.dev_user}"
      environment: "local"
      source_code_path: "."
      data_quality_table: "edh-ssc_local_catalog.edh-ssc.data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
    resources:
      apps:
        edh-ssc:
          # Dev-only: "Anyone in my organization can use" (grants the
          # `All account users` group CAN_USE). Appended to the base app
          # permissions; stage/prod stay restricted to explicit grants.
          permissions:
            - level: CAN_USE
              group_name: "All account users"
        mcp-server:
          # Dev-only org-wide CAN_USE, mirroring the main app so the MCP
          # server is reachable by anyone in the org in dev.
          permissions:
            - level: CAN_USE
              group_name: "All account users"

  # Development environment
  dev:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "dev"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-dev"
      environment: "dev"
      source_code_path: "."
      data_quality_table: "edh-ssc_dev_catalog.edh-ssc.data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
    resources:
      apps:
        edh-ssc:
          # Dev-only: "Anyone in my organization can use" (grants the
          # `All account users` group CAN_USE). Appended to the base app
          # permissions; stage/prod stay restricted to explicit grants.
          permissions:
            - level: CAN_USE
              group_name: "account users"
        mcp-server:
          # Dev-only org-wide CAN_USE, mirroring the main app so the MCP
          # server is reachable by anyone in the org in dev.
          permissions:
            - level: CAN_USE
              group_name: "account users"

  # Staging environment
  stage:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "stage"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-stage"
      environment: "stage"
      source_code_path: "."
      data_quality_table: "enterprise_stg..data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"

  # Production environment
  prod:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "prod"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-prod"
      environment: "prod"
      source_code_path: "."
      data_quality_table: "edh-ssc_prod_catalog.edh-ssc.data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
      # Lock authoring in prod: workflows are promoted in as a vetted bundle, not hand-edited live.
      workflow_authoring_locked: "true"
