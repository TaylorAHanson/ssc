bundle:
  name: atlas
  # Require minimum CLI version for Databricks Apps support
  databricks_cli_version: ">=0.211.0"

# Resources
resources:
  apps:
    atlas:
      name: ${var.app_name}
      description: "ATLAS - Self-service platform for Databricks"
      source_code_path: ./backend

# Sync configuration
sync:
  include:
    # Include all backend code
    - backend/**
  exclude:
    # Python cache and compiled files
    - backend/__pycache__/**
    - backend/**/__pycache__/**
    - backend/**/*.pyc
    - backend/**/*.pyo
    # Virtual environment
    - backend/venv/**
    - backend/.venv/**
    # Environment and config files
    - backend/.env
    - backend/.env.*
    # Database files
    - backend/*.db
    # IDE and OS files
    - backend/.DS_Store
    - backend/**/.DS_Store
    # Test and cache directories
    - backend/.pytest_cache/**
    - backend/.mypy_cache/**
    # Build artifacts
    - backend/*.egg-info/**
    - backend/dist/**
    - backend/build/**
    # Logs
    - backend/*.log
    # Git files
    - backend/.git/**
    - backend/.gitignore

# Variables
variables:
  dev_user:
    description: "Developer username for personal dev instances"
    default: ""
  app_name:
    description: "Application name"
    default: "atlas"

# Target environments
targets:
  # Local development (default)
  local:
    mode: development
    default: true
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "local"
        Environment: "local"
        Application: "ATLAS Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "atlas-local-${var.dev_user}"

  # Development environment
  dev:
    mode: development
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "dev"
        Application: "ATLAS Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "atlas-dev"

  # Staging environment
  stage:
    mode: development
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "stage"
        Application: "ATLAS Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "atlas-stage"

  # Production environment
  prod:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "prod"
        Application: "ATLAS Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "atlas-prod"
