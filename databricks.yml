# Databricks Asset Bundle Configuration
# 
# This bundle ONLY syncs files to workspace.
# App creation and deployment is handled by deploy.sh
#
# Usage:
#   ./deploy.sh dev rohan-ahire
#
# Prerequisites:
#   export DATABRICKS_HOST=https://your-workspace.cloud.databricks.com
#   databricks auth login

bundle:
  name: atlas

# Sync backend directory to workspace
sync:
  paths:
    - backend

# Target environments
targets:
  dev:
    mode: development
    default: true
