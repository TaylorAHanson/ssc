bundle:
  name: edh-ssc
  databricks_cli_version: ">=0.283.0"  # Apps with app.config support

resources:

  database_instances:
    edh_ssc_db:
      name: "edh-ssc-${var.environment}-v5"
      enable_pg_native_login: true
      capacity: "CU_1"
      lifecycle:
        prevent_destroy: true
      permissions:
        # Authoritative ACL — must re-grant the deploying user CAN_MANAGE or the
        # app's `postgres` attach later fails ("User needs MANAGE permission").
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        # Keep the app SP's instance access from being stripped on re-apply. The
        # Postgres CONNECT+CREATE grant is separate (postgres: block below).
        - level: CAN_USE
          service_principal_name: ${resources.apps.edh-ssc.service_principal_client_id}
        - level: CAN_USE
          group_name: "users"

  apps:
    edh-ssc:
      name: ${var.app_name}
      description: "edh-ssc - Self-service platform for ${var.environment}"
      source_code_path: "${var.source_code_path}"
      resources:
        # Autoscaling Lakebase attach. `database` takes the Postgres-API database
        # *ID* (databases/db-xxxx), not the display name — per-target variable.
        - name: postgres
          postgres:
            branch: projects/${resources.database_instances.edh_ssc_db.name}/branches/production
            database: projects/${resources.database_instances.edh_ssc_db.name}/branches/production/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE
      config:
        command:
          - python
          - backend/run.py
        env:
          - name: ENVIRONMENT
            value: "${var.environment}"
          - name: GITOPS_MODE
            value: "${var.gitops_mode}"
          - name: GITOPS_VOLUME_PATH
            value: "${var.gitops_volume_path}"
          - name: DEFAULT_ENVIRONMENT
            value: "${var.environment}"
          - name: GIT_USERNAME
            value: "${var.git_username}"
          - name: GIT_EMAIL
            value: "${var.git_email}"
          - name: INFRA_REPO_URL
            value: "${var.infra_repo_url}"
          - name: INFRA_REPO_BRANCH
            value: "${var.infra_repo_branch}"
          # GitHub PAT lives in the control-tower scope; only the key is configurable.
          - name: GIT_TOKEN_SECRET_SCOPE
            value: "${var.controltower_secret_scope}"
          - name: GIT_TOKEN_SECRET_KEY
            value: "${var.github_pat_secret_key}"
          - name: GITHUB_ORG
            value: "${var.github_org}"
          # Governance tag GitOps: the app commits generated ALTER ... TAGS SQL to
          # this repo/branch and a workflow there applies it on merge.
          - name: GOVERNANCE_TAGS_REPO
            value: "${var.governance_tags_repo}"
          - name: GOVERNANCE_TAGS_BASE_BRANCH
            value: "${var.governance_tags_base_branch}"
          - name: GOVERNANCE_TAGS_PATH
            value: "${var.governance_tags_path}"
          # Apply-outcome ledger (optional; omitted when blank, same reason as the
          # AI gateway below). Set var.governance_tags_ledger_table and uncomment
          # to have the app verify the apply instead of trusting the merge:
          # - name: GOVERNANCE_TAGS_LEDGER_TABLE
          #   value: "${var.governance_tags_ledger_table}"
          - name: DATABRICKS_WAREHOUSE_ID
            value: "${var.sql_warehouse_id}"
          # Existing all-purpose cluster for classic-compute jobs; SP needs CAN_RESTART.
          - name: DATABRICKS_JOB_CLUSTER_ID
            value: "${var.databricks_job_cluster_id}"
          - name: MODEL_SERVING_AGENT_LLM_ENDPOINT
            value: "${var.model_serving_endpoint}"
          # AI Gateway model (optional). When set, agent LLM calls go through the
          # gateway's /ai-gateway/mlflow/v1/chat/completions route with this value
          # sent as the model (use a "system.ai.*" reference, e.g.
          # system.ai.gpt-5-6-luna). Omitted when blank — Apps reject empty env
          # values. Set var.ai_gateway_endpoint and uncomment to enable:
          # - name: AI_GATEWAY_ENDPOINT
          #   value: "${var.ai_gateway_endpoint}"
          - name: MLFLOW_TRACING_ENABLED
            value: "${var.mlflow_tracing_enabled}"
          # MLflow experiment (optional; omitted when blank, same reason as above):
          # - name: MLFLOW_EXPERIMENT
          #   value: "${var.mlflow_experiment}"
          # Enforce agent-tool OPA policy in deployed envs (code default: shadow).
          - name: AGENT_TOOL_OPA_ENFORCE
            value: "${var.agent_tool_opa_enforce}"
          # Lock no-code workflow authoring (prod=true; workflows change via bundle only).
          - name: WORKFLOW_AUTHORING_LOCKED
            value: "${var.workflow_authoring_locked}"
          # Pluggable identity-group provider (noop|rest|lmws).
          - name: IDENTITY_PROVIDER
            value: "${var.identity_provider}"
          - name: AGENT_ENABLED
            value: "true"
          - name: AGENT_MAX_ITERATIONS
            value: "10"
          - name: AGENT_TIMEOUT_SECONDS
            value: "60"
          - name: CORS_ORIGINS
            value: "*"
          - name: POLLER_INTERVAL_SECONDS
            value: "5"
          - name: POLLER_BATCH_SIZE
            value: "50"
          - name: POLLER_MAX_CONCURRENT
            value: "10"
          - name: POLLER_LOCK_TIMEOUT_MINUTES
            value: "5"
          - name: POLLER_LOCK_TIMEOUT_LONG_RUNNING_MINUTES
            value: "30"
          - name: POLLER_HEARTBEAT_INTERVAL_SECONDS
            value: "300"
          - name: API_V1_PREFIX
            value: "/api/v1"
          - name: PROJECT_NAME
            value: "edh-ssc"
          - name: LOG_LEVEL
            value: "INFO"
          - name: EVENT_SYNC_CRON
            value: "${var.event_sync_cron}"
          - name: DATA_ASSET_SYNC_CRON
            value: "${var.data_asset_sync_cron}"
          - name: ENFORCEMENT_SENTINEL_CRON
            value: "${var.enforcement_sentinel_cron}"
          # Governance admins: recipients of the Sentinel's immediate HIGH-severity
          # alerts and the anchored once-per-day digest.
          - name: GOVERNANCE_EMAIL_GROUP
            value: "${var.governance_email_group}"
          - name: DATA_QUALITY_TABLE
            value: "${var.data_quality_table}"
          - name: DATA_QUALITY_ADOC_SCHEMA
            value: "${var.data_quality_adoc_schema}"
          # AWS SES email. IAM creds read at runtime from the control-tower scope
          # by fixed key convention; only the scope is env-specific.
          - name: NOTIFICATION_EMAIL_PROVIDER
            value: "${var.notification_email_provider}"
          - name: NOTIFICATION_EMAIL_SES_REGION
            value: "${var.ses_region}"
          - name: NOTIFICATION_EMAIL_SES_SOURCE
            value: "${var.ses_source_email}"
          - name: NOTIFICATION_EMAIL_SES_SECRET_SCOPE
            value: "${var.controltower_secret_scope}"
          # LMWS/FWS group management: notebook reads creds from the same scope.
          - name: LMWS_SECRET_SCOPE
            value: "${var.controltower_secret_scope}"
          # Per-env target-workspace SP creds (sp_dbxgrc_<env>_*), same scope.
          - name: TARGET_WORKSPACE_SP_SECRET_SCOPE
            value: "${var.controltower_secret_scope}"

      user_api_scopes:
        - "sql"
        - "sql.statement-execution"
        - "sql.warehouses"
        - "catalog.connections"
        - "dashboards.genie"
        - "files.files"
        # Required for OBO PERSONAL skills under /Workspace/Users/<user>/.skills;
        # without it, saving a personal skill fails on a downscoped token.
        - "workspace.workspace"
        - "genie"
        - "mcp.functions"
        - "ai-gateway"

      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"

    # Example standalone MCP server (Streamable HTTP). The "mcp-" name prefix makes
    # Databricks surface it under Workspace → AI Gateway → MCPs. Serves at <url>/mcp.
    mcp-server:
      name: "mcp-${var.app_name}"
      description: "Example MCP server (Streamable HTTP) — discoverable in AI Gateway → MCPs"
      source_code_path: "./mcp_app"
      config:
        command:
          - python
          - server.py
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"

  # Scheduled LLM-as-judge job: scores recent agent traces and writes an
  # LLM_JUDGE assessment keyed by trace_id, to compare against human feedback.
  jobs:
    agent_quality_judge:
      name: "${var.app_name}-agent-quality-judge-${var.environment}"
      schedule:
        quartz_cron_expression: "${var.llm_judge_cron}"
        timezone_id: "UTC"
        pause_status: "${var.llm_judge_pause_status}"
      tasks:
        - task_key: judge
          environment_key: default
          spark_python_task:
            python_file: "backend/app/jobs/llm_judge.py"
            parameters: ["--limit", "100"]
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - mlflow-skinny>=2.20.0
              - httpx
              - pydantic
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"

sync:
  include:
    - package.json
    - vite.config.ts
    - tsconfig.json
    - tailwind.config.js
    - postcss.config.js
    - eslint.config.js
    - index.html
    - src/**
    - public/**
    - backend/**
    - mcp_app/**
  exclude:
    # Frontend deps/build output (node_modules ~340MB stalls source download).
    - node_modules/**
    - "**/node_modules/**"
    - dist/**
    - .vite/**
    - backend/__pycache__/**
    - backend/**/__pycache__/**
    - backend/**/*.pyc
    - backend/**/*.pyo
    - backend/venv/**
    - backend/.venv/**
    - backend/.env
    - backend/.env.*
    - backend/*.db
    - backend/.DS_Store
    - backend/**/.DS_Store
    - backend/.pytest_cache/**
    - backend/.mypy_cache/**
    - backend/*.egg-info/**
    - backend/dist/**
    - backend/build/**
    - backend/*.log
    - backend/.git/**
    - backend/.gitignore

variables:
  dev_user:
    description: "Developer username for personal dev instances"
    default: "taylor"
  app_name:
    description: "Application name"
    default: "edh-ssc"
  environment:
    description: "Environment name (local, dev, stage, prod)"
    default: "local"
  source_code_path:
    description: "Path to source code in workspace"
    default: "."
  lakebase_host:
    description: "Lakebase Database Host"
    default: "instance-c77ef127-eeca-44f5-80ba-76b800757462.database.cloud.databricks.com"
  lakebase_database_id:
    description: >-
      Autoscaling Lakebase database resource id for the app's postgres.database
      path (the resource id, NOT the raw datname). Default suits instances that
      registered a default DB as `databricks-postgres`; older instances override.
    default: "databricks-postgres"
  gitops_mode:
    description: "GitOps mode (volume or direct)"
    default: "volume"
  gitops_volume_path:
    description: "Unity Catalog Volume path for GitOps requests"
    default: "/Volumes/edh-ssc_dev_catalog/edh-ssc/gitops_requests"
  git_username:
    description: "Username for GitOps commits"
    default: "edh-ssc Bot"
  git_email:
    description: "Email for GitOps commits"
    default: "edh-ssc-bot@databricks.com"
  infra_repo_url:
    description: "URL for the infrastructure repository"
    default: "https://github.com/databricks-field-eng/fe-agentic-self-service-terraform"
  infra_repo_branch:
    description: "Branch for the infrastructure repository"
    default: "main"
  github_pat_secret_key:
    description: "Secret key for the GitHub PAT within controltower_secret_scope"
    default: "github-pat"
  github_org:
    description: "GitHub organization for repo/template operations (same across envs)"
    default: "databricks-field-eng"
  governance_tags_repo:
    description: "Repo the app opens UC tag-change PRs against ('owner/repo', or bare name resolved against github_org)"
    default: "tag-manager"
  governance_tags_base_branch:
    description: >-
      Branch tag-change PRs target. The governance repo keeps one long-lived
      branch per environment and merging is what applies the tags, so this must
      match the environment this app instance governs — hence per-target, no
      shared default.
    default: "dev"
  governance_tags_path:
    description: "Directory in the governance repo where generated .sql migrations are committed"
    default: "tags/migrations"
  governance_tags_ledger_table:
    description: >-
      Fully-qualified Delta table the governance repo's apply job writes each
      migration's outcome to; the app reads it to confirm a merged PR actually
      applied. The app SP needs SELECT on it. Blank = complete at merge, unverified.
    default: ""
  databricks_job_cluster_id:
    description: >-
      Existing all-purpose cluster ID for classic-compute jobs; the app SP needs
      CAN_RESTART. Placeholder keeps deploy from failing on empty env values.
    default: "REPLACE_WITH_CLUSTER_ID"
  sql_warehouse_id:
    description: "Databricks SQL Warehouse ID"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  model_serving_endpoint:
    description: "Model Serving Endpoint for Agent LLM"
    default: "databricks-claude-sonnet-4-6"
  ai_gateway_endpoint:
    description: "AI Gateway model reference for the agent LLM, sent to /ai-gateway/mlflow/v1/chat/completions (e.g. system.ai.gpt-5-6-luna). Blank = call model_serving_endpoint directly."
    default: ""
  mlflow_tracing_enabled:
    description: "Enable MLflow tracing for the agent (true/false)"
    default: "false"
  mlflow_experiment:
    description: "MLflow experiment path for agent traces (blank = default)"
    default: ""
  agent_tool_opa_enforce:
    description: "Enforce the agent-tool OPA policy (true) vs. shadow/log-only (false)."
    default: "true"
  workflow_authoring_locked:
    description: "Lock no-code workflow authoring (true) so workflows only change via bundle import."
    default: "false"
  identity_provider:
    description: "Identity-group provider backend: noop | rest | lmws"
    default: "noop"
  llm_judge_cron:
    description: "Quartz cron for the scheduled LLM-as-judge quality job"
    default: "0 0 6 * * ?"
  llm_judge_pause_status:
    description: "PAUSED or UNPAUSED for the LLM-as-judge job schedule"
    default: "PAUSED"
  data_quality_table:
    description: "Table where data quality results are stored"
    default: "edh-ssc_local_catalog.edh-ssc.data_quality_results"
  data_quality_adoc_schema:
    description: "catalog.schema holding the ADOC *_history tables"
    default: "enterprise_stg.data_quality"
  event_sync_cron:
    description: "Cron schedule for syncing calendar events"
    default: "0 * * * *"
  data_asset_sync_cron:
    description: "Cron schedule for syncing data assets"
    default: "0 * * * *"
  enforcement_sentinel_cron:
    description: "Cron schedule for running enforcement sentinel"
    default: "*/30 * * * *"
  governance_email_group:
    description: >-
      Governance-admin email address / distribution group that receives
      Enforcement Sentinel notifications: immediate alerts for new HIGH-severity
      violations and the anchored once-per-day governance digest.
    default: "data-governance@example.com"
  notification_email_provider:
    description: "Email provider for notifications (smtp, ses, mock)"
    default: "ses"
  ses_region:
    description: "AWS region for SES"
    default: "us-west-2"
  ses_source_email:
    description: "SES-verified source email address for notifications"
    default: "notifications@example.com"
  controltower_secret_scope:
    description: >-
      Per-environment control-tower secret scope holding all cross-system creds
      by fixed key convention (SES IAM, target-workspace SPs, LMWS). Only the
      scope is env-specific; the app SP needs READ.
    default: "controltower_secret_scope_prd"
  # LMWS/FWS-API base URLs (optional; empty defaults). Referenced only in targets
  # that set them, so stage/prod don't render an empty env value (Apps reject it).
  lmws_authn_url:
    description: "LMWS authn base URL. Optional; set per target."
    default: ""
  lmws_rest_url:
    description: "LMWS REST base URL. Optional; set per target."
    default: ""
  lmws_cache_url:
    description: "LMWS list-cache-info base URL. Optional; set per target."
    default: ""
  lmws_fws_url:
    description: "FWS-API entitlement base URL. Optional; set per target."
    default: ""

targets:
  local:
    mode: development
    default: true
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "local"
        Environment: "local"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-local-${var.dev_user}"
      environment: "local"
      source_code_path: "."
      data_quality_table: "edh-ssc_local_catalog.edh-ssc.data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
    resources:
      apps:
        edh-ssc:
          # Dev-only org-wide access; stage/prod stay restricted to explicit grants.
          permissions:
            - level: CAN_USE
              group_name: "All account users"
        mcp-server:
          permissions:
            - level: CAN_USE
              group_name: "All account users"

  dev:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "dev"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-dev"
      environment: "dev"
      source_code_path: "."
      data_quality_table: "edh-ssc_dev_catalog.edh-ssc.data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
      controltower_secret_scope: "controltower_secret_scope_dev"
      governance_tags_base_branch: "dev"
      databricks_job_cluster_id: "REPLACE_WITH_DEV_CLUSTER_ID"
      # Fill in the real LMWS gateway URLs; placeholders are non-empty so deploy
      # won't fail, but LMWS actions error clearly until set.
      lmws_authn_url: "REPLACE_WITH_LMWS_AUTHN_URL"
      lmws_rest_url: "REPLACE_WITH_LMWS_REST_URL"
      lmws_cache_url: "REPLACE_WITH_LMWS_CACHE_URL"
      lmws_fws_url: "REPLACE_WITH_LMWS_FWS_URL"
    resources:
      apps:
        edh-ssc:
          # Dev-only org-wide access; stage/prod stay restricted.
          permissions:
            - level: CAN_USE
              group_name: "account users"
          # Dev-only LMWS URLs, appended so stage/prod never carry these entries.
          config:
            env:
              - name: LMWS_AUTHN_URL
                value: "${var.lmws_authn_url}"
              - name: LMWS_REST_URL
                value: "${var.lmws_rest_url}"
              - name: LMWS_CACHE_URL
                value: "${var.lmws_cache_url}"
              - name: LMWS_FWS_URL
                value: "${var.lmws_fws_url}"
        mcp-server:
          permissions:
            - level: CAN_USE
              group_name: "account users"

  stage:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "stage"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-stage"
      environment: "stage"
      source_code_path: "."
      data_quality_table: "enterprise_stg..data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
      # Older instance registered its default DB with an opaque id (not the
      # `databricks-postgres` slug). Same underlying data.
      lakebase_database_id: "db-zm1o-5e047bf1j3"
      controltower_secret_scope: "controltower_secret_scope_stg"
      governance_tags_base_branch: "stage"

  prod:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "prod"
        Application: "edh-ssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edh-ssc-prod"
      environment: "prod"
      source_code_path: "."
      data_quality_table: "edh-ssc_prod_catalog.edh-ssc.data_quality_results"
      event_sync_cron: "0 * * * *"
      data_asset_sync_cron: "0 * * * *"
      enforcement_sentinel_cron: "*/30 * * * *"
      governance_tags_base_branch: "prod"
      workflow_authoring_locked: "true"
    resources:
      apps:
        edh-ssc:
          # Prod runs on LARGE (4 vCPU / 12 GB) instead of the default MEDIUM
          # (2 vCPU / 6 GB): the Enforcement Sentinel holds a full multi-workspace
          # scan's findings in memory before persisting, and prod scans are the
          # largest. dev/stage stay MEDIUM.
          compute_size: LARGE
