notifications:
  governance_email_group: "data-governance@example.com"

# Web lookup configuration (used by the search_databricks_docs / fetch_doc_page
# tools when the `web_search` feature flag is on).
web_search:
  # Domains the agent is allowed to fetch pages from. Suffix-matched, so
  # "databricks.com" also permits "docs.databricks.com". `docs.databricks.com`
  # is always allowed even if this list is empty. Add approved sites here as
  # you expand scope (e.g. an internal Confluence base host).
  allowed_domains:
    - docs.databricks.com
  # Sitemaps used for keyless discovery in search_databricks_docs. Each must be
  # on an allowed domain. The default covers the AWS English docs.
  sitemaps:
    - "https://docs.databricks.com/aws/en/sitemap.xml"
  # OPTIONAL: Algolia DocSearch public (search-only) credentials. When all three
  # are set, search_databricks_docs uses Algolia full-text search for higher
  # recall; otherwise it falls back to sitemap keyword discovery. These are the
  # public, safe-to-expose keys the docs site itself uses (find them in the
  # browser devtools Network tab on a docs search request).
  algolia:
    app_id: ""
    api_key: ""
    index_name: ""
  # Result/fetch guardrails.
  max_results: 8 # Max search hits returned
  fetch_timeout_seconds: 15 # Per-request HTTP timeout
  max_fetch_chars: 20000 # Cap on extracted page text handed to the model