# Target Workspaces Configuration
# Define authoritative target workspaces for the agent to operate on.
# To securely map Databricks Secrets to these workspaces without hardcoding them,
# use Databricks Apps environment variable mapping in your app.yaml:
#   env:
#     - name: PROD_WS_CLIENT_ID
#       valueFrom: databricks-secret:atlas_sp_credentials:prod_client_id
#
# target_workspaces:
#   - name: "enterprise-prod"
#     host: "https://adb-123456789.1.azuredatabricks.net"
#     environment: "prod"
#     client_id_env: "PROD_WS_CLIENT_ID"
#     client_secret_env: "PROD_WS_CLIENT_SECRET"
#   - name: "enterprise-dev"
#     host: "https://adb-987654321.2.azuredatabricks.net"
#     environment: "dev"
#     client_id_env: "DEV_WS_CLIENT_ID"
#     client_secret_env: "DEV_WS_CLIENT_SECRET"

branding:
  name: "Enterprise Data Hub"
  logo_url: "https://upload.wikimedia.org/wikipedia/commons/f/fc/Qualcomm-Logo.svg"
  # Accent blue aligned with the companion Command Center app's design tokens
  # (see src/theme.ts). The dark navy sidebar / heading color is structural
  # and lives in CSS variables (--theme-nav-bg, --theme-heading).
  primary_color: "#007BFF"
  secondary_color: "#001E3C"
  info_color: "#007BFF"
  alert_color: "#D32F2F"
  warning_color: "#FFC107"
  success_color: "#388E3C"
  # External URL for the companion Command Center app. When set, a
  # "Command Center" link appears in the "Build & Deploy" sidebar group.
  command_center_url: "https://fevm-taylor-hanson-build.cloud.databricks.com/apps/command-center"

features:
  core: true
  governance: true
  finops: true
  self_service: true
  workflows: true
  data_discovery: true # Turns on the data discovery feature
  calendar: true # Turns on the calendar feature

ui:
  app_switcher:    
    - id: "self-service"
      name: "Discover & Access"
      sub_label: "Self Service"
      short_description: "Request access and provision data resources."
      description: "Search the enterprise data catalog, request access to data, and provision Databricks resources for your project."
      icon: "Layout"
      path: "/"
      cta_label: "Launch"
      accent_color: "#2563eb"
      accent_bg: "#eff6ff"
      # Optional shortcuts shown on the AppLauncher card in place of the
      # standard "Launch" CTA. Each link supports `label`, `path`, and an
      # optional lucide `icon` name.
      quick_links:
        - label: "Discover data"
          path: "/discovery"
          icon: "Search"
        - label: "Request something"
          path: "/request"
          icon: "Plus"
    - id: "command-center"
      name: "Customize Widgets and Views"
      sub_label: "Command Center"
      short_description: "Build custom widgets and views."
      description: "Build custom widgets and combine apps, dashboards, tools, agents, and more into a single view."
      icon: "FileText"
      path: "/admin/dashboard"
      cta_label: "Launch"
      accent_color: "#4f46e5"
      accent_bg: "#eef2ff"
    - id: "databricks-one"
      name: "Analyze & Chat with Data"
      sub_label: "Databricks Genie"
      short_description: "Perform deep research and chat with your data."
      description: "Perform deep research and chat with your data."
      icon: "Database"
      href: "https://adb-123456789.1.azuredatabricks.net"
      cta_label: "Open"
      accent_color: "#ea580c"
      accent_bg: "#fff7ed"
    - id: "databricks-lakehouse"
      name: "Build Dashboards, Pipelines, etc."
      sub_label: "Lakehouse"
      short_description: "Build pipelines, dashboards, and more."
      description: "Unify your data, analytics, and AI on a single platform with an open lakehouse architecture for better performance and governance."
      icon: "Hammer"
      href: "https://adb-123456789.1.azuredatabricks.net"
      cta_label: "Open"
      accent_color: "#dc2626"
      accent_bg: "#fef2f2"
  tabs:
    home: true
    data_discovery: true
    my_requests: true
    pending_approvals: true
    training: true
    event_calendar: true
    templates_assets: true
    community_links: true
    admin: true
    reports: true
    training_upload: true
    certification: true
    odps: true
    allowlist: true
    sentinel: true

