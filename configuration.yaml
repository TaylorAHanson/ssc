  RequestType.ENFORCEMENT_SENTINEL: true
  RequestType.GITHUB_REPO_CREATION: true
  RequestType.DATA_CERTIFICATION: true
  RequestType.PROJECT_ONBOARDING: true
  RequestType.REPORT_EXECUTION: true
  RequestType.REST_API_ACCESS: true
  RequestType.SERVICE_PRINCIPAL: true
  RequestType.SIMPLE_EMAIL: true
  RequestType.WORKSPACE_ACCESS: true
  RequestType.WORKSPACE_PROVISION: true
  RequestType.TAG_CREATION: true
  RequestType.TAG_CHANGE: true
  RequestType.CREDENTIAL_CREATION: true
  RequestType.VOLUME_CREATION: true
  RequestType.WORKSPACE_FOLDER_CREATION: true
  RequestType.GITHUB_REPO_ACCESS: true
