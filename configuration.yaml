# Target Workspaces Configuration
# Define authoritative target workspaces for the agent to operate on.
# To securely map Databricks Secrets to these workspaces without hardcoding them,
# use Databricks Apps environment variable mapping in your app.yaml:
#   env:
#     - name: PROD_WS_CLIENT_ID
#       valueFrom: databricks-secret:atlas_sp_credentials:prod_client_id
#
# target_workspaces:
#   - name: "enterprise-prod"
#     host: "https://adb-123456789.1.azuredatabricks.net"
#     environment: "prod"
#     client_id_env: "PROD_WS_CLIENT_ID"
#     client_secret_env: "PROD_WS_CLIENT_SECRET"
#   - name: "enterprise-dev"
#     host: "https://adb-987654321.2.azuredatabricks.net"
#     environment: "dev"
#     client_id_env: "DEV_WS_CLIENT_ID"
#     client_secret_env: "DEV_WS_CLIENT_SECRET"

branding:
  name: "Enterprise Data Hub"
  # Short, identifier-friendly form of the name used where the brand appears as a
  # slug rather than display text (e.g. provisioned GitHub repo-name prefixes and
  # the git commit author for bot PRs). Defaults to `name` when omitted; set this
  # to keep generated identifiers concise (e.g. "edh").
  # short_name: "edh"
  # Optional explicit git commit author for bot-authored PRs/commits. Defaults are
  # derived from the brand (e.g. "Enterprise Data Hub Bot") when omitted.
  # git_username: ""
  # git_email: ""
  # Your organization's wordmark/logo URL. Leave blank to render the name only.
  logo_url: ""
  # Accent blue aligned with the companion Command Center app's design tokens
  # (see src/theme.ts). The dark navy sidebar / heading color is structural
  # and lives in CSS variables (--theme-nav-bg, --theme-heading).
  primary_color: "#007BFF"
  secondary_color: "#001E3C"
  info_color: "#007BFF"
  alert_color: "#D32F2F"
  warning_color: "#FFC107"
  success_color: "#388E3C"
  # External URL for the companion Command Center app. When set, a
  # "Command Center" link appears in the "Build & Customize" sidebar group.
  command_center_url: ""

links:
  # External "Open in Databricks" deep link surfaced inside the
  # Ask Your Data page so power users can pop into the native Genie
  # UI for deeper exploration. When empty, the in-page button is
  # hidden. Defaults to the workspace's /one entry point if you
  # leave it blank and the workspace URL is configured (the frontend
  # falls back to that automatically).
  genie_full_experience_url: ""

features:
  core: true
  governance: true
  finops: true
  self_service: true
  workflows: true
  data_discovery: true # Turns on the data discovery feature
  calendar: true # Turns on the calendar feature
  # Enables the new "Ask Your Data" tab and the matching ask_your_data tool.
  # Backed by Databricks Genie (Managed MCP). Disable this in environments
  # where Genie isn't available or OBO auth isn't configured.
  ask_your_data: true
  # Genie answer presentation. By default (false) the agent surfaces Genie's
  # own ``final_answer`` markdown verbatim — Genie already returns a polished,
  # grounded answer, so the extra LLM "summarization" turn only adds latency,
  # cost, and a chance to rephrase the answer less precisely. Set this to true
  # to feed Genie's answer back through the agent for a final summarization
  # turn (useful if you want the answer reworded in the agent's voice or merged
  # with other tool results).
  genie_summarize_answer: false
  # Context Catalog: curated knowledge base (context domains + documents) that
  # the agent retrieves from. Gates the admin UI, the API, and the retrieval
  # tools below.
  context_catalog: true
  # Workflow authoring: DB-backed, admin-editable workflow definitions ("workflows as
  # data") that replace the filesystem instruction markdown. Gates the admin UI
  # and the /workflows API; the agent always reads published workflows.
  workflow_authoring: true
  # Onboarding suggestions: on login, the home page asks the agent for a few
  # personalized, clickable starting prompts (role + recent-activity hints).
  # One cached LLM call per session with a deterministic role-based fallback.
  onboarding_suggestions: true
  # Web lookup: lets the agent search & read Databricks documentation (and any
  # additional approved domains) to answer product/how-to questions with
  # citations. Keyless by default (sitemap-backed discovery). Requires outbound
  # HTTPS to the approved domains (see the web_search block below).
  web_search: true
  # Feedback: lets any user submit feedback / feature requests / bug reports
  # from the avatar menu (and via the chat agent). Bug reports can attach a
  # client-side console + network-error snapshot. Admins triage submissions in
  # the Admin panel. Gates the API, the admin tab, and the submit_feedback tool.
  feedback: true

ui:
  tabs:
    home: true
    data_discovery: true
    ask_your_data: true
    my_requests: true
    pending_approvals: true
    training: true
    event_calendar: true
    templates_assets: true
    community_links: true
    admin: true
    reports: true
    training_upload: true
    certification: true
    odps: true
    allowlist: true
    sentinel: true
    tag_management: true
    context_catalog: true
    workflows: true
    feedback: true

tools:
  check_allowlist_status: true
  check_github_repo: true
  check_orphaned_assets: true
  does_service_principal_exist: true
  get_workflow_instructions: true
  evaluate_policy: true
  execute_workflow: true
  get_catalog_list: true
  get_cost_summary: true
  get_forecasted_spend: true
  get_resource_efficiency_metrics: true
  get_schema_list: true
  get_table_list: true
  get_volume_list: true
  # Fast keyword search over the locally-cached data catalog (synced UC
  # tables/views). Preferred first step for data-discovery questions; gated by
  # the data_discovery feature flag.
  search_data_assets: true
  get_credential_list: true
  check_workspace_path: true
  get_target_workspaces: true
  # Connectivity diagnostic: SDK "ping" of target workspaces to prove
  # cross-VPC / hub-spoke reachability (reuses existing credentials).
  ping_workspaces: false
  list_github_templates: true
  list_workspaces: true
  search_events: true
  search_requests: true
  group_lookup: true
  member_lookup: true
  check_resource_access: true
  search_approvals: true
  search_user_entitlements: true
  check_tagging_compliance: true
  check_object_permissions: true
  audit_user_access: true
  search_audit_logs: true
  check_overprovisioned_users: true
  check_asset_quality: true
  find_owner: true
  check_training_status: true
  # Context Catalog retrieval tools (gated by the context_catalog feature flag)
  list_context_domains: true
  search_context_catalog: true
  get_context_document: true
  # Web lookup tools (gated by the web_search feature flag). search_databricks_docs
  # finds relevant doc pages; fetch_doc_page reads an approved page's text.
  search_databricks_docs: true
  fetch_doc_page: true
  # Lets the agent record a user's feedback / feature request / bug report into
  # the feedback store (mirrors the avatar-menu form). Gated by the feedback
  # feature flag at runtime.
  submit_feedback: true
  # Databricks Genie (the general-purpose data chat in Databricks One)
  # via Managed MCP. Slow tool (30-120s per question); safeguarded by
  # the `ask_your_data` feature flag and an OBO-only auth path. By
  # default the tool calls the general Genie endpoint
  # (`/api/2.0/mcp/genie`), which searches across the caller's
  # accessible Unity Catalog data and any Genie Spaces they have.
  # Setting `default_genie_space_id` is OPTIONAL: if non-empty, all
  # Ask Your Data traffic is pinned to that single curated Genie Space
  # (`/api/2.0/mcp/genie/{space_id}`) instead of the general server.
  # Leave it empty for the typical "ask everything" experience.
  ask_your_data:
    enabled: true
    default_genie_space_id: ""
  # No-code workflow (Workflow) authoring tools. Admin-only (gated by
  # required_role) so the agent can help Platform/Governance Admins design,
  # validate, preview, and publish workflows in chat.
  list_workflow_building_blocks: true
  get_workflow: true
  validate_workflow_spec: true
  preview_workflow_spec: true
  save_workflow_draft: true
  publish_workflow: true

workflows:
