# =============================================================================
# Service Principals (per-environment, with per-workspace overrides)
# =============================================================================
# Strategy: one SP pair (client_id + client_secret) per ENVIRONMENT, shared by
# every target workspace in that environment. e.g. sp_dbxgrc_dev connects to any
# dev workspace. Credentials are read at RUNTIME from a Databricks secret scope
# (like SES/GitHub secrets) — NOT injected as plaintext env vars — so changing
# the strategy is a config edit, never a code change or redeploy.
#
# Resolution precedence per workspace (highest first), so you can change your
# mind or go hybrid (sp_dbxgrc_dev for most dev workspaces, a different SP for a
# few) without re-architecting:
#   1. Per-workspace env vars:    client_id_env / client_secret_env / token_env
#   2. Per-workspace secret keys: client_id_secret / client_secret_secret
#                                 (+ optional secret_scope override)
#   3. Per-environment shared SP: service_principals.environments[<env>] (below)
#   4. Global default SP / PAT:   settings.DATABRICKS_* (the app's own identity)
#
# Prereqs for the per-environment SP to work:
#   - The app's own SP must have READ on the secret scope.
#   - Each sp_dbxgrc_<env> SP must be granted access to the workspaces it targets.
#
# NOTE: the secret SCOPE is the one environment-specific piece, so it lives in
# databricks.yml (var.target_workspace_sp_secret_scope -> the
# TARGET_WORKSPACE_SP_SECRET_SCOPE env var) and is set per deploy target. The
# key-NAME convention below is constant across environments. You can still pin a
# fallback scope here (uncomment secret_scope), but databricks.yml wins.
service_principals:
  # secret_scope: "controltower_secret_scope_prd"   # optional fallback; databricks.yml overrides
  environments:
    dev:
      client_id_key: "sp_dbxgrc_dev_client_id"
      client_secret_key: "sp_dbxgrc_dev_client_secret"
    stg:
      client_id_key: "sp_dbxgrc_stg_client_id"
      client_secret_key: "sp_dbxgrc_stg_client_secret"
    prod:
      client_id_key: "sp_dbxgrc_prd_client_id"
      client_secret_key: "sp_dbxgrc_prd_client_secret"

# =============================================================================
# Target Workspaces
# =============================================================================
# Define the authoritative target workspaces for the agent to operate on. Each
# workspace inherits its environment's shared SP (above) automatically — list a
# workspace with just name/host/environment and it uses sp_dbxgrc_<env>.
#
# To override a single workspace (the hybrid case), pin its own credentials with
# either per-workspace secret keys or env vars (see precedence above).
#
# target_workspaces:
#   # Inherits the shared dev SP (sp_dbxgrc_dev) — no credentials needed.
#   - name: "dev-domain-a"
#     host: "https://adb-987654321.2.azuredatabricks.net"
#     environment: "dev"
#   - name: "dev-domain-b"
#     host: "https://adb-111111111.3.azuredatabricks.net"
#     environment: "dev"
#   # Hybrid override: this dev workspace uses a DIFFERENT SP than the rest.
#   - name: "dev-domain-special"
#     host: "https://adb-222222222.4.azuredatabricks.net"
#     environment: "dev"
#     client_id_secret: "sp_special_dev_client_id"
#     client_secret_secret: "sp_special_dev_client_secret"
#     # Optionally read this workspace's SP from a different scope:
#     # secret_scope: "team_special_secret_scope"
#   - name: "enterprise-prod"
#     host: "https://adb-123456789.1.azuredatabricks.net"
#     environment: "prod"

branding:
  name: "Atlas"
  # Short, identifier-friendly form of the name used where the brand appears as a
  # slug rather than display text (e.g. provisioned GitHub repo-name prefixes and
  # the git commit author for bot PRs). Defaults to `name` when omitted; set this
  # to keep generated identifiers concise (e.g. "edh"). Also used as the compact
  # landing-page header label (logo + short_name).
  # short_name: "edh"
  # Optional explicit git commit author for bot-authored PRs/commits. Defaults are
  # derived from the brand (e.g. "Enterprise Data Hub Bot") when omitted.
  # git_username: ""
  # git_email: ""
  # Your organization's wordmark/logo URL. Leave blank to render the name only.
  logo_url: ""
  # Accent blue aligned with the companion Command Center app's design tokens
  # (see src/theme.ts). The dark navy sidebar / heading color is structural
  # and lives in CSS variables (--theme-nav-bg, --theme-heading).
  primary_color: "#007BFF"
  secondary_color: "#001E3C"
  info_color: "#007BFF"
  alert_color: "#D32F2F"

# ─── Self-Service Center ──────────────────────────────────────────────────
# The landing page offers two views: "Assistant" (the conversational agent) and
# "Self-Service Center" — a catalog of quick-action cards grouped by category.
# This whole section is data-driven so each customer can curate the cards (and
# rebrand) without touching code.
#
# Per category:
#   title:  category heading (required)
#   icon:   optional lucide icon name (e.g. Database, Boxes, Search). Default: Boxes.
#   cards:  list of action cards. Each card:
#     title:        card label (required)
#     description:  optional tooltip / one-line blurb
#     prompt:       seeds the Assistant with this text and switches to it (preferred)
#     route:        OR navigate to an in-app route instead of the Assistant
#                   (exactly one of prompt/route; if both, route wins)
#     allowed_personas: optional role gate, e.g. ["Platform Admin"]
#
# Set `enabled: false` to hide the toggle and show only the Assistant.
self_service_center:
  enabled: true
  categories:
    - title: "Data Access"
      icon: "Database"
      cards:
        - title: "Request Data Access"
          description: "Get read/write access to a catalog, schema, table, or volume."
          prompt: "I need to request access to a data asset."
        - title: "REST API Access"
          description: "Request access to a REST API or external endpoint."
          prompt: "I need REST API access."
        - title: "My Groups"
          description: "See the identity groups you belong to."
          prompt: "What groups am I a member of?"
        - title: "My Current Access"
          description: "Review the data access you already have."
          prompt: "Show me my current data access."
    - title: "Enterprise Data"
      icon: "Search"
      cards:
        - title: "Discover Enterprise Data"
          description: "Browse the catalog of available data products and datasets."
          route: "/discovery"
        - title: "Marketplace Certification"
          description: "Learn about certified data products (ODCS)."
          prompt: "Tell me about data product certification."
        - title: "Learn About Data Quality"
          description: "Understand data quality scores and checks."
          prompt: "How does data quality scoring work here?"
    - title: "Platform Services"
      icon: "Boxes"
      cards:
        - title: "Workspace Access"
          description: "Request access to a Databricks workspace."
          prompt: "I need access to a workspace."
        - title: "Provision Workspace"
          description: "Request a new workspace to be provisioned."
          prompt: "I need a new workspace provisioned."
        - title: "Create Catalog or Schema"
          description: "Request a new Unity Catalog catalog or schema."
          prompt: "I want to create a new catalog or schema."
        - title: "Service Principal"
          description: "Request a new service principal."
          prompt: "I need a service principal created."
        - title: "GitHub Repository"
          description: "Request a new GitHub repository."
          prompt: "I need a new GitHub repository."

# ─── Community Links ──────────────────────────────────────────────────────
# The "Community Links" page (sidebar › Learn & Share) is fully data-driven so
# each customer curates their own resources/tools — no hardcoded links.
#
# Each category has: name, optional icon, and a `links` list. Every link is a
# compact one-line string:  "Title | URL | icon | description"
#   - Title + URL are required; icon + description are optional (trailing parts).
#   - icon is a lucide name (BookOpen, GraduationCap, Code, Eye, Activity,
#     BarChart, DollarSign, Settings, Globe, FileText, ...); defaults to the
#     category icon when omitted.
# Set `enabled: false` to hide the Community Links page entirely.
# Replace placeholder (example.com) URLs with your real internal tools.
community_links:
  enabled: true
  categories:
    - name: "Documentation & Knowledge"
      icon: "BookOpen"
      links:
        - "Confluence | https://databricks.atlassian.net | FileText | Internal docs, wikis, and knowledge base"
        - "Databricks Documentation | https://docs.databricks.com | BookOpen | Official Databricks docs and guides"
    - name: "Training & Learning"
      icon: "GraduationCap"
      links:
        - "Databricks Academy | https://www.databricks.com/learn/training/home | GraduationCap | Courses, certifications, and learning"
    - name: "Development & Code"
      icon: "Code"
      links:
        - "GitHub | https://github.com/example | Code | Source code repositories and version control"
        - "Jenkins | https://jenkins.example.com | Settings | CI/CD pipeline management and automation"
    - name: "Monitoring & Observability"
      icon: "Eye"
      links:
        - "Datadog UI | https://datadog.example.com | Activity | App performance monitoring and observability"
        - "Acceldata UI | https://acceldata.example.com | BarChart | Data observability and quality monitoring"
        - "Finout UI | https://finout.example.com | DollarSign | Cloud cost management and optimization"

# Embedded apps: external web apps surfaced *inside* this app via an iframe.
# Each entry adds a sidebar link that opens the app in-page at
# `/embedded/<id>` — no tab switch, normal back/forward history. Add as many
# as you like. Entries render in the order listed here (within their group);
# reorder by moving entries up/down. Empty-URL entries are ignored.
#
# NOTE: Many Databricks-hosted targets (and other apps) send
# `X-Frame-Options: SAMEORIGIN` or a strict `Content-Security-Policy:
# frame-ancestors`, which browsers honor by rendering the iframe blank. The
# embedded view surfaces a hint + "open in a new tab" fallback in that case.
#
# Fields per entry:
#   id:               unique slug (required). Used in the route + nav id, and
#                     as the `ui.tabs.<id>` key so admins can hide it.
#   title:            sidebar label (required).
#   url:              iframe src, https (required). Empty = entry skipped.
#   icon:             optional lucide icon name (default: LayoutDashboard).
#                     e.g. LayoutDashboard, BarChart, Database, Gauge, Globe,
#                     Activity, Workflow, ShieldCheck, FileText, Boxes.
#   group:            optional sidebar group (default: "Build & Customize").
#                     One of the existing groups or a new one.
#   description:      optional one-line blurb shown on the Welcome page.
#   allowed_personas: optional role gate (omit = visible to everyone), e.g.
#                     ["Platform Admin", "Governance Admin"].
# Set to [] to disable all embedded apps.
# Command Center embedded app — DISABLED via config (implementation code is
# kept intact). To re-enable it as a "Build & Customize" sidebar item, remove
# the `[]` below and uncomment the block.
embedded_apps: []
#  - id: command_center
#    title: "Command Center"
#    url: "https://google.com"
#    icon: "LayoutDashboard"
#    group: "Build & Customize"
#    description: "Operations dashboards for the platform."
#   - id: grafana
#     title: "Grafana"
#     url: "https://grafana.internal.example.com/d/abc"
#     icon: "Activity"
#     group: "Watch Tower"
#     allowed_personas: ["Platform Admin"]

links:
  # External "Open in Databricks" deep link surfaced inside the
  # Ask Your Data page so power users can pop into the native Genie
  # UI for deeper exploration. When empty, the in-page button is
  # hidden. Defaults to the workspace's /one entry point if you
  # leave it blank and the workspace URL is configured (the frontend
  # falls back to that automatically).
  genie_full_experience_url: ""

features:
  core: true
  governance: true
  finops: true
  self_service: true
  workflows: true
  data_discovery: true # Turns on the data discovery feature
  calendar: true # Turns on the calendar feature
  # Gates the SCHEDULED Enforcement Sentinel run in the background poller
  # (ENFORCEMENT_SENTINEL_CRON). Without this the poller never invokes the
  # sentinel scheduler, so only manual runs happen. (The `ui.tabs.sentinel`
  # flag below only controls tab visibility, not the schedule.)
  sentinel: true # Turns on the scheduled Enforcement Sentinel poller
  # Enables the new "Ask Your Data" tab and the matching ask_your_data tool.
  # Backed by Databricks Genie (Managed MCP). Disable this in environments
  # where Genie isn't available or OBO auth isn't configured.
  ask_your_data: true
  # SQL-native data answers: lets the agent run READ-ONLY SQL it composes itself
  # (SELECT/WITH/SHOW/DESCRIBE/EXPLAIN) on Databricks SQL via the run_sql tool.
  # Runs On-Behalf-Of the user, so their Unity Catalog permissions apply. Feeds
  # the same in-chat charting pipeline as Genie. Requires a configured SQL
  # warehouse (warehouse_id). Disable where OBO auth or a warehouse isn't set up.
  run_sql: true
  # Genie answer presentation. By default (false) the agent surfaces Genie's
  # own ``final_answer`` markdown verbatim — Genie already returns a polished,
  # grounded answer, so the extra LLM "summarization" turn only adds latency,
  # cost, and a chance to rephrase the answer less precisely. Set this to true
  # to feed Genie's answer back through the agent for a final summarization
  # turn (useful if you want the answer reworded in the agent's voice or merged
  # with other tool results).
  genie_summarize_answer: false
  # Context Catalog: curated knowledge base (context domains + documents) that
  # the agent retrieves from. Gates the admin UI, the API, and the retrieval
  # tools below.
  context_catalog: true
  # Workflow authoring: DB-backed, admin-editable workflow definitions ("workflows as
  # data") that replace the filesystem instruction markdown. Gates the admin UI
  # and the /workflows API; the agent always reads published workflows.
  workflow_authoring: true
  # Onboarding suggestions: on login, the home page asks the agent for a few
  # personalized, clickable starting prompts (role + recent-activity hints).
  # One cached LLM call per session with a deterministic role-based fallback.
  onboarding_suggestions: true
  # Web lookup: lets the agent search & read Databricks documentation (and any
  # additional approved domains) to answer product/how-to questions with
  # citations. Keyless by default (sitemap-backed discovery). Requires outbound
  # HTTPS to the approved domains (see the web_search block below).
  web_search: true
  # Feedback: lets any user submit feedback / feature requests / bug reports
  # from the avatar menu (and via the chat agent). Bug reports can attach a
  # client-side console + network-error snapshot. Admins triage submissions in
  # the Admin panel. Gates the API, the admin tab, and the submit_feedback tool.
  feedback: true
  # Tool Registry: data-driven agent tool governance. Admins toggle each tool
  # (local or discovered from a Databricks MCP server) per agent surface
  # (EDH chat vs workflow-authoring chat), set allowed roles, and pick SP/OBO
  # identity. Gates the /tool-registry API and the admin UI.
  tool_registry: true
  # Training LMS: admin-authored learning tracks + courses with media/docs
  # uploaded to a UC Volume and per-learner consumption tracking. Gates the
  # Training admin UI (the learner Training page is always available).
  training_admin: true
  # Agent Skills: SKILL.md folders the agent can LOAD at run time, stored OBO in
  # the user's personal Workspace folder and in `.skills` dirs on UC Volumes the
  # user can read. Authoring now lives in the Command Center's Agent Studio; this
  # flag gates the read-only /skills API and the list_skills/get_skill load tools.
  skills: true
  # Enhanced landing page: shows the verbose header stack on the home / new-chat
  # page — the brand title, the time-of-day greeting + "Welcome, <name>", the
  # "What would you like to know?" line, and the "Assistant / Self-Service
  # Center" view toggle (when a self_service_center catalog is configured below).
  # When false (default for this build) those header lines are hidden for a
  # clean, uncluttered landing. The chat input, starter-prompt chips, and the
  # pinned catalog rails are always shown regardless of this flag.
  enhanced_landing_page: false

ui:
  tabs:
    home: true
    data_discovery: true
    ask_your_data: true
    my_requests: true
    pending_approvals: true
    training: true
    event_calendar: true
    templates_assets: false
    community_links: true
    admin: true
    reports: false
    training_upload: true
    certification: true
    odps: true
    allowlist: true
    sentinel: true
    tag_management: true
    context_catalog: true
    workflows: true
    tool_registry: true
    feedback: true
    training_admin: true

tools:
  check_allowlist_status: true
  check_github_repo: true
  # Validates contributor GitHub usernames (exists? org member?) before adding
  # them to a repo's team during github_repo_creation.
  check_github_user: true
  # Agent-level GitHub access request: looks up a repo/team and returns the
  # GitHub-native "request access" / "request to join" link. No app-side gate —
  # a repo/team owner approves in GitHub. (Not a workflow.)
  request_github_access: true
  check_orphaned_assets: true
  does_service_principal_exist: true
  get_workflow_instructions: true
  evaluate_policy: true
  execute_workflow: true
  get_catalog_list: true
  get_cost_summary: true
  get_forecasted_spend: true
  get_resource_efficiency_metrics: true
  get_schema_list: true
  get_table_list: true
  get_volume_list: true
  # Fast keyword search over the locally-cached data catalog (synced UC
  # tables/views). Preferred first step for data-discovery questions; gated by
  # the data_discovery feature flag.
  search_data_assets: true
  get_credential_list: true
  check_workspace_path: true
  get_target_workspaces: true
  # Connectivity diagnostic: SDK "ping" of target workspaces to prove
  # cross-VPC / hub-spoke reachability (reuses existing credentials).
  ping_workspaces: false
  # Generic connectivity diagnostic: HTTP-ping any URL from the app to prove
  # network reachability (e.g. an internal API gateway across corporate egress).
  # Sends no credentials; supports verify_tls=false for internal-CA hosts.
  ping_url: true
  list_github_templates: true
  # Lists GitHub org teams so users can pick which team to request access to
  # (pairs with the github_repo_access workflow / native GitHub request links).
  list_github_teams: true
  list_workspaces: true
  search_events: true
  search_requests: true
  group_lookup: true
  member_lookup: true
  check_resource_access: true
  search_approvals: true
  search_user_entitlements: true
  check_tagging_compliance: true
  check_object_permissions: true
  audit_user_access: true
  search_audit_logs: true
  check_overprovisioned_users: true
  check_asset_quality: true
  find_owner: true
  check_training_status: true
  # Agent Skills load tools (gated by the `skills` feature flag). Read-only and
  # OBO: they only ever surface the caller's own Workspace folder / readable
  # volumes. Authoring moved to the Command Center's Agent Studio.
  list_skills: true
  get_skill: true
  # Context Catalog retrieval tools (gated by the context_catalog feature flag)
  list_context_domains: true
  search_context_catalog: true
  get_context_document: true
  # Web lookup tools (gated by the web_search feature flag). search_databricks_docs
  # finds relevant doc pages; fetch_doc_page reads an approved page's text.
  search_databricks_docs: true
  fetch_doc_page: true
  # Lets the agent record a user's feedback / feature request / bug report into
  # the feedback store (mirrors the avatar-menu form). Gated by the feedback
  # feature flag at runtime.
  submit_feedback: true
  # Databricks Genie (the general-purpose data chat in Databricks One)
  # via Managed MCP. Slow tool (30-120s per question); safeguarded by
  # the `ask_your_data` feature flag and an OBO-only auth path. By
  # default the tool calls the general Genie endpoint
  # (`/api/2.0/mcp/genie`), which searches across the caller's
  # accessible Unity Catalog data and any Genie Spaces they have.
  # Setting `default_genie_space_id` is OPTIONAL: if non-empty, all
  # Ask Your Data traffic is pinned to that single curated Genie Space
  # (`/api/2.0/mcp/genie/{space_id}`) instead of the general server.
  # Leave it empty for the typical "ask everything" experience.
  ask_your_data:
    enabled: true
    default_genie_space_id: ""
    # How long the chat client keeps polling for a Genie answer before giving
    # up with "Genie did not respond within Ns". This is purely a client-side
    # poll window (each poll is a short request), NOT a Databricks limit — raise
    # it for slow Genie spaces / heavy queries. Default 300s (5 min).
    poll_timeout_seconds: 300
  # Turns a data answer into a chart on demand ("graph that as a line by month").
  # Emits a compact chart directive the chat UI renders client-side (Vega-Lite),
  # bound to the rows already returned — no re-query. Gated by the same
  # `ask_your_data` feature flag since it complements Genie data answers.
  render_chart: true
  # Read-only SQL execution that feeds the charting pipeline. Runs through the
  # Databricks-managed DBSQL MCP server's `execute_sql_read_only` tool, so the
  # read-only guarantee is enforced server-side (not by us) and the query runs
  # On-Behalf-Of the user. Gated by the `run_sql` feature flag above.
  run_sql: true
  # Draft an Open Data Contract (ODCS) / Open Data Product (ODPS) document from a
  # described dataset. Read-only authoring helpers gated by the governance flag.
  draft_odcs_contract: true
  draft_odps_document: true
  # No-code workflow (Workflow) authoring tools. Admin-only (gated by
  # required_role) so the agent can help Platform/Governance Admins design,
  # validate, preview, and publish workflows in chat.
  list_workflow_building_blocks: true
  # Finds existing published workflows similar to one the user describes, so the
  # authoring agent can suggest reuse before creating a duplicate.
  search_similar_workflows: true
  get_workflow: true
  validate_workflow_spec: true
  preview_workflow_spec: true
  # Advisory safety + completeness scoring (risk/quality + findings) the agent
  # runs before recommending save/publish.
  evaluate_workflow_spec: true
  save_workflow_draft: true
  publish_workflow: true

# NOTE: The legacy per-type `workflows:` enable/disable map has been removed.
# Request types are now data-driven: the source of truth is published workflows
# in the database plus the seed catalog (backend/app/workflows/graphs/catalog),
# validated via WorkflowService.known_request_types(). To disable a workflow,
# unpublish it in the admin Workflows UI, or set `tools.execute_workflow: false`
# as a global kill switch.

notifications:
  governance_email_group: "data-governance@example.com"

# Web lookup configuration (used by the search_databricks_docs / fetch_doc_page
# tools when the `web_search` feature flag is on).
web_search:
  # Domains the agent is allowed to fetch pages from. Suffix-matched, so
  # "databricks.com" also permits "docs.databricks.com". `docs.databricks.com`
  # is always allowed even if this list is empty. Add approved sites here as
  # you expand scope (e.g. an internal Confluence base host).
  allowed_domains:
    - docs.databricks.com
  # Sitemaps used for keyless discovery in search_databricks_docs. Each must be
  # on an allowed domain. The default covers the AWS English docs.
  sitemaps:
    - "https://docs.databricks.com/aws/en/sitemap.xml"
  # OPTIONAL: Algolia DocSearch public (search-only) credentials. When all three
  # are set, search_databricks_docs uses Algolia full-text search for higher
  # recall; otherwise it falls back to sitemap keyword discovery. These are the
  # public, safe-to-expose keys the docs site itself uses (find them in the
  # browser devtools Network tab on a docs search request).
  algolia:
    app_id: ""
    api_key: ""
    index_name: ""
  # Result/fetch guardrails.
  max_results: 8 # Max search hits returned
  fetch_timeout_seconds: 15 # Per-request HTTP timeout
  max_fetch_chars: 20000 # Cap on extracted page text handed to the model