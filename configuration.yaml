  RequestType.REST_API_ACCESS: true
  RequestType.SERVICE_PRINCIPAL: true
  RequestType.SIMPLE_EMAIL: true
  RequestType.WORKSPACE_ACCESS: true
  RequestType.WORKSPACE_PROVISION: true
  RequestType.TAG_CREATION: true
