api_version: "v1"
kind: "DataContract"
dataset:
  domain: "sales"
  name: "demo_certified_dataset"
  # Format is expected to be <catalog>.<schema>.<table>
  physical_name: "main.default.customer_orders"

quality:
  technical:
    score_threshold: 100
  business:
    score_threshold: 100

security:
  classification: "PII"
  abac_required: true

metadata:
  certification_eligible: true
  tags:
    "Owner group": "data-engineering"
    "Approver group": "data-governance"
    "Domain": "sales"
    # Missing "SLO/SLA" tag, which will fail policy
