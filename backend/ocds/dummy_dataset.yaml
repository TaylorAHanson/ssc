apiVersion: v3.1.0
kind: DataContract

domain: sales
dataProduct: demo_certified_dataset
version: 1.1.0
status: active
id: 31281432-6c55-4ba2-a65f-72344a91553c

description:
  purpose: Customer orders for demo purposes.
  limitations: Contains dummy data.
  usage: Demonstrating certification workflows.

quality:
  - id: technical_dq_threshold
    type: custom
    engine: acceldata
    description: "Technical data quality score must be 100%"
    mustBe: 100
  - id: business_dq_threshold
    type: custom
    engine: acceldata
    description: "Business logic validation score must be 100%"
    mustBe: 100

servers:
  - id: production
    type: databricks
    host: prod-workspace.cloud.databricks.com
    catalog: sales_prod_catalog
    schema: main

schema:
  - id: customer_orders_obj
    name: customer_orders
    physicalName: customer_orders
    physicalType: table
    businessName: Customer Orders Demo
    description: Demo dataset for customer orders
    tags: [ 'demo', 'sales']
    customProperties:
      - property: abac_required
        value: true
      - property: classification
        value: PII
    properties:
      - id: order_id_prop
        name: order_id
        primaryKey: true
        logicalType: string
        description: Unique identifier for the order

price:
  priceAmount: 0.00
  priceCurrency: USD
  priceUnit: request  # Meaning "It costs $0 per request"

team:
  name: data-engineering
  members:
    - username: thanson
      role: Owner

customProperties:
  - property: certification_eligible
    value: true
  - property: is_mock
    value: false
  - property: databricks_tags
    value:
      "Owner group": "data-engineering"
      "Approver group": "data-governance"
      "Domain": "sales"
      # Missing "SLO/SLA" tag intentionally for failure
