# Databricks App Configuration for ATLAS
# This file defines how the app runs on Databricks Apps platform

command:
  - python
  - run.py
   
env:
  # Database Configuration (Lakebase - PostgreSQL)
  # Password is fetched automatically from Databricks secrets using the app's service principal
  # Get DATABASE_HOST from: terraform output lakebase_read_write_dns
  - name: DATABASE_HOST
    value: "instance-c77ef127-eeca-44f5-80ba-76b800757462.database.cloud.databricks.com"
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: "databricks_postgres"
  - name: DATABASE_USER
    value: "atlas_app"
  - name: DATABASE_SECRET_SCOPE
    value: "atlas-hub"
  - name: DATABASE_SECRET_KEY
    value: "lakebase-password"
  
  # Infrastructure Repository (Terraform GitOps)
  - name: INFRA_REPO_URL
    value: "https://github.com/databricks-field-eng/fe-agentic-self-service-terraform"
  - name: INFRA_REPO_BRANCH
    value: "main"
  - name: DEFAULT_ENVIRONMENT
    value: "dev"
  - name: GIT_USERNAME
    value: "ATLAS Bot"
  - name: GIT_EMAIL
    value: "atlas-bot@databricks.com"
  
  # GitHub PAT Authentication (fallback, works with IP allowlist)
  # Fetched at runtime from Databricks secrets
  - name: GIT_TOKEN_SECRET_SCOPE
    value: "atlas-hub"
  - name: GIT_TOKEN_SECRET_KEY
    value: "github-pat"
  
  # GitHub App Authentication (atlas-infra-bot) - blocked by org IP allowlist
  # Kept for future use if IP allowlist is updated
  - name: GITHUB_APP_ID
    value: ""
  - name: GITHUB_APP_PRIVATE_KEY_SECRET_SCOPE
    value: "atlas-hub"
  - name: GITHUB_APP_PRIVATE_KEY_SECRET_KEY
    value: "github-app-private-key"

  # Databricks Configuration
  - name: DATABRICKS_WAREHOUSE_ID
    value: "5c5e40da3caf812c"
  - name: MODEL_SERVING_AGENT_LLM_ENDPOINT
    value: "databricks-gemini-2-5-flash"  # Updated to force redeploy
  - name: AGENT_ENABLED
    value: "true"
  - name: AGENT_MAX_ITERATIONS
    value: "10"
  - name: AGENT_TIMEOUT_SECONDS
    value: "60"
  - name: CORS_ORIGINS
    value: "*"
  - name: POLLER_INTERVAL_SECONDS
    value: "5"
  - name: POLLER_BATCH_SIZE
    value: "50"
  - name: POLLER_MAX_CONCURRENT
    value: "10"
  - name: POLLER_LOCK_TIMEOUT_MINUTES
    value: "5"
  - name: POLLER_LOCK_TIMEOUT_LONG_RUNNING_MINUTES
    value: "30"
  - name: POLLER_HEARTBEAT_INTERVAL_SECONDS
    value: "300"
  - name: API_V1_PREFIX
    value: "/api/v1"
  - name: PROJECT_NAME
    value: "ATLAS"
  - name: LOG_LEVEL
    value: "INFO"
  - name: BRAND_NAME
    value: "ATLAS"
  - name: BRAND_COLOR_PRIMARY
    value: "#FF3621"
  - name: BRAND_COLOR_SECONDARY
    value: "#1B5162"
  - name: BRAND_COLOR_INFO
    value: "#1B5162"
  - name: BRAND_COLOR_ALERT
    value: "#98102A"
  - name: BRAND_COLOR_WARNING
    value: "#FFAB00"
  - name: BRAND_COLOR_SUCCESS
    value: "#00A972"
  - name: BRAND_LOGO_URL
    value: ""
  - name: NOTIFICATION_EMAIL_SMTP_HOST
    value: ""
  - name: NOTIFICATION_EMAIL_SMTP_PORT
    value: "587"
  - name: NOTIFICATION_EMAIL_SMTP_USER
    value: ""
  - name: NOTIFICATION_EMAIL_SMTP_PASSWORD
    value: ""
  - name: NOTIFICATION_SLACK_WEBHOOK_URL
    value: ""
  - name: NOTIFICATION_TEAMS_WEBHOOK_URL
    value: ""
  - name: EVENT_CALENDAR_URL
    value: ""
  - name: EVENT_SYNC_INTERVAL_MINUTES
    value: "60"
