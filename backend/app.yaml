# Databricks App Configuration for ATLAS
# This file defines how the app runs on Databricks Apps platform

command:
  - python
  - run.py

env:
  - name: DATABRICKS_HOST
    valueFrom: "{{workspace_url}}"
  - name: DATABRICKS_WORKSPACE_URL
    valueFrom: "{{workspace_url}}"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "5c5e40da3caf812c"
  - name: MODEL_SERVING_AGENT_LLM_ENDPOINT
    value: databricks-gemini-2-5-flash
  - name: AGENT_ENABLED
    value: "true"
  - name: AGENT_MAX_ITERATIONS
    value: "10"
  - name: AGENT_TIMEOUT_SECONDS
    value: "60"
  - name: CORS_ORIGINS
    value: "*"
  - name: POLLER_INTERVAL_SECONDS
    value: "5"
  - name: POLLER_BATCH_SIZE
    value: "50"
  - name: POLLER_MAX_CONCURRENT
    value: "10"
  - name: POLLER_LOCK_TIMEOUT_MINUTES
    value: "5"
  - name: POLLER_LOCK_TIMEOUT_LONG_RUNNING_MINUTES
    value: "30"
  - name: POLLER_HEARTBEAT_INTERVAL_SECONDS
    value: "300"
  - name: API_V1_PREFIX
    value: "/api/v1"
  - name: PROJECT_NAME
    value: "ATLAS"
  - name: LOG_LEVEL
    value: "INFO"
  - name: BRAND_NAME
    value: "ATLAS"
  - name: BRAND_COLOR_PRIMARY
    value: "#FF3621"
  - name: BRAND_COLOR_SECONDARY
    value: "#1B5162"
  - name: BRAND_COLOR_INFO
    value: "#1B5162"
  - name: BRAND_COLOR_ALERT
    value: "#98102A"
  - name: BRAND_COLOR_WARNING
    value: "#FFAB00"
  - name: BRAND_COLOR_SUCCESS
    value: "#00A972"
  - name: BRAND_LOGO_URL
    value: ""
  - name: NOTIFICATION_EMAIL_SMTP_HOST
    value: ""
  - name: NOTIFICATION_EMAIL_SMTP_PORT
    value: "587"
  - name: NOTIFICATION_EMAIL_SMTP_USER
    value: ""
  - name: NOTIFICATION_EMAIL_SMTP_PASSWORD
    value: ""
  - name: NOTIFICATION_SLACK_WEBHOOK_URL
    value: ""
  - name: NOTIFICATION_TEAMS_WEBHOOK_URL
    value: ""
