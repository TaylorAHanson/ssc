bundle:
  name: edhssc
  # Require minimum CLI version for Databricks Apps support
  databricks_cli_version: ">=0.211.0"

# Resources
resources:
  apps:
    edhssc:
      name: ${var.app_name}
      description: "edhssc - Self-service platform for ${var.environment}"

      # Source code path - Points to backend directory in synced bundle
      source_code_path: "${var.source_code_path}"

      # NOTE: user_api_scopes removed due to Terraform provider bug
      # Can be configured manually in Databricks UI after deployment

      # Permissions for the app itself (who can manage/use the app)
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"

# Sync configuration
sync:
  include:
    # Include all backend code
    - backend/**
  exclude:
    # Python cache and compiled files
    - backend/__pycache__/**
    - backend/**/__pycache__/**
    - backend/**/*.pyc
    - backend/**/*.pyo
    # Virtual environment
    - backend/venv/**
    - backend/.venv/**
    # Environment and config files
    - backend/.env
    - backend/.env.*
    # Database files
    - backend/*.db
    # IDE and OS files
    - backend/.DS_Store
    - backend/**/.DS_Store
    # Test and cache directories
    - backend/.pytest_cache/**
    - backend/.mypy_cache/**
    # Build artifacts
    - backend/*.egg-info/**
    - backend/dist/**
    - backend/build/**
    # Logs
    - backend/*.log
    # Git files
    - backend/.git/**
    - backend/.gitignore

# Variables
variables:
  dev_user:
    description: "Developer username for personal dev instances"
    default: ""
  app_name:
    description: "Application name"
    default: "edhssc"
  environment:
    description: "Environment name (local, dev, stage, prod)"
    default: "local"
  source_code_path:
    description: "Path to source code in workspace"
    default: "./backend"

# Target environments
targets:
  # Local development (default)
  local:
    mode: development
    default: true
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "local"
        Environment: "local"
        Application: "edhssc Self-Service"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edhssc-local-${var.dev_user}"
      environment: "local"
      source_code_path: "./backend"

  # Development environment
  dev:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "dev"
        Application: "edhssc Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edhssc-dev"
      environment: "dev"
      source_code_path: "./backend"

  # Staging environment
  stage:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "stage"
        Application: "edhssc Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edhssc-stage"
      environment: "stage"
      source_code_path: "./backend"

  # Production environment
  prod:
    mode: production
    presets:
      tags:
        version: "VERSION_TAG"
        Repo_name: "${bundle.name}"
        deployed_via: "CICD"
        Environment: "prod"
        Application: "edhssc Self-Service"
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "edhssc-prod"
      environment: "prod"
      source_code_path: "./backend"
