# Target Workspaces Configuration
# Define authoritative target workspaces for the agent to operate on.
# To securely map Databricks Secrets to these workspaces without hardcoding them,
# use Databricks Apps environment variable mapping in your app.yaml:
#   env:
#     - name: PROD_WS_CLIENT_ID
#       valueFrom: databricks-secret:atlas_sp_credentials:prod_client_id
#
# target_workspaces:
#   - name: "enterprise-prod"
#     host: "https://adb-123456789.1.azuredatabricks.net"
#     environment: "prod"
#     client_id_env: "PROD_WS_CLIENT_ID"
#     client_secret_env: "PROD_WS_CLIENT_SECRET"
#   - name: "enterprise-dev"
#     host: "https://adb-987654321.2.azuredatabricks.net"
#     environment: "dev"
#     client_id_env: "DEV_WS_CLIENT_ID"
#     client_secret_env: "DEV_WS_CLIENT_SECRET"

branding:
  name: "Self-Service Center"
  # Short, identifier-friendly brand used for generated identifiers (repo-name
  # prefixes, git bot author). Defaults to `name` when omitted.
  # short_name: "ssc"
  logo_url: ""
  primary_color: "#3253DC"
  secondary_color: "#000000"
  info_color: "#3253DC"
  alert_color: "#D32F2F"
  warning_color: "#FFC107"
  success_color: "#388E3C"

features:
  core: true
  governance: true
  finops: true
  self_service: true
  workflows: true

ui:
  tabs:
    home: true
    my_requests: true
    pending_approvals: true
    training: true
    event_calendar: true
    templates_assets: true
    community_links: true
    admin: true
    reports: true
    training_upload: true
    certification: false
    odps: false
    allowlist: false
    sentinel: false
    tag_management: false

tools:
  check_allowlist_status: false
  check_github_repo: true
  check_orphaned_assets: true
  does_service_principal_exist: true
  get_workflow_instructions: true
  evaluate_policy: false
  execute_workflow: true
  get_catalog_list: true
  get_cost_summary: true
  get_forecasted_spend: true
  get_resource_efficiency_metrics: false
  get_schema_list: true
  get_table_list: true
  get_volume_list: true
  get_credential_list: true
  check_workspace_path: true
  get_target_workspaces: true
  list_github_templates: true
  list_workspaces: true
  search_events: true
  search_requests: true
  group_lookup: false
  member_lookup: false
  check_resource_access: true
  search_approvals: true
  search_user_entitlements: true
  check_tagging_compliance: true
  check_object_permissions: true
  audit_user_access: true
  search_audit_logs: true
  check_overprovisioned_users: true
  check_asset_quality: false
  find_owner: true
  check_training_status: false

# NOTE: The legacy per-type `workflows:` enable/disable map has been removed.
# Request types are now data-driven (published workflows in the DB + seed
# catalog, validated via WorkflowService.known_request_types()). Disable a
# workflow by unpublishing it, or set `tools.execute_workflow: false`.