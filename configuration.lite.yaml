# Target Workspaces Configuration
# Define authoritative target workspaces for the agent to operate on.
# To securely map Databricks Secrets to these workspaces without hardcoding them,
# use Databricks Apps environment variable mapping in your app.yaml:
#   env:
#     - name: PROD_WS_CLIENT_ID
#       valueFrom: databricks-secret:atlas_sp_credentials:prod_client_id
#
# target_workspaces:
#   - name: "enterprise-prod"
#     host: "https://adb-123456789.1.azuredatabricks.net"
#     environment: "prod"
#     client_id_env: "PROD_WS_CLIENT_ID"
#     client_secret_env: "PROD_WS_CLIENT_SECRET"
#   - name: "enterprise-dev"
#     host: "https://adb-987654321.2.azuredatabricks.net"
#     environment: "dev"
#     client_id_env: "DEV_WS_CLIENT_ID"
#     client_secret_env: "DEV_WS_CLIENT_SECRET"

